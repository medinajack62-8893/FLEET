<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ניהול צי מנופים וצמ"ה</title>
  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone@7.25.6/babel.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Segoe UI', Arial, sans-serif; background: #f8f7f4; color: #1c1917; direction: rtl; }
    :root {
      --primary: #ea580c;
      --primary-light: #fed7aa;
      --primary-dark: #c2410c;
      --bg: #f8f7f4;
      --sidebar-w: 256px;
      --white: #ffffff;
      --border: #e7e5e4;
      --text: #1c1917;
      --text-muted: #78716c;
      --success: #16a34a;
      --danger: #dc2626;
      --warning: #d97706;
    }

    /* Layout */
    #sidebar {
      position: fixed; top: 0; right: 0; width: var(--sidebar-w);
      height: 100vh; background: var(--white); border-left: 1px solid var(--border);
      display: flex; flex-direction: column; z-index: 100; overflow-y: auto;
    }
    #main { margin-right: var(--sidebar-w); min-height: 100vh; padding: 24px; }

    /* Sidebar */
    .sidebar-logo {
      padding: 20px 16px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 10px;
    }
    .logo-icon {
      width: 40px; height: 40px; border-radius: 10px;
      background: linear-gradient(135deg, var(--primary), #d97706);
      display: flex; align-items: center; justify-content: center;
      font-size: 20px; color: white; flex-shrink: 0;
    }
    .logo-text h1 { font-size: 16px; font-weight: 700; color: var(--text); }
    .logo-text p { font-size: 11px; color: var(--text-muted); }
    .nav-list { list-style: none; padding: 12px 8px; flex: 1; }
    .nav-item {
      display: flex; align-items: center; gap: 10px;
      padding: 10px 12px; border-radius: 10px; cursor: pointer;
      color: var(--text-muted); font-size: 14px; font-weight: 500;
      transition: all 0.15s; margin-bottom: 2px;
    }
    .nav-item:hover { background: #f5f5f4; color: var(--text); }
    .nav-item.active {
      background: linear-gradient(135deg, var(--primary), #d97706);
      color: white;
    }
    .nav-item span.icon { font-size: 18px; width: 22px; text-align: center; }

    /* Cards & Stats */
    .stat-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 16px; margin-bottom: 24px; }
    .stat-card {
      background: var(--white); border-radius: 14px; padding: 20px;
      border: 1px solid var(--border); display: flex; align-items: center; gap: 14px;
    }
    .stat-icon {
      width: 48px; height: 48px; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0;
    }
    .stat-info h3 { font-size: 26px; font-weight: 700; color: var(--text); }
    .stat-info p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }

    /* Page header */
    .page-header { margin-bottom: 20px; display: flex; justify-content: space-between; align-items: center; }
    .page-header h2 { font-size: 22px; font-weight: 700; }
    .page-header p { color: var(--text-muted); font-size: 13px; margin-top: 2px; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 8px 16px; border-radius: 8px; border: none;
      font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.15s;
    }
    .btn-primary { background: var(--primary); color: white; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text); }
    .btn-outline:hover { background: #f5f5f4; }
    .btn-danger { background: var(--danger); color: white; }
    .btn-danger:hover { background: #b91c1c; }
    .btn-sm { padding: 5px 10px; font-size: 12px; }

    /* Table */
    .table-card { background: var(--white); border-radius: 14px; border: 1px solid var(--border); overflow: hidden; }
    .table-scroll { overflow-x: auto; overflow-y: auto; max-height: 72vh; }
    .table-scroll table { min-width: 750px; }
    .table-scroll thead th { position: sticky; top: 0; background: var(--white); z-index: 1; box-shadow: 0 1px 0 var(--border); }
    .table-header { padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .table-header h3 { font-size: 15px; font-weight: 600; }
    table { width: 100%; border-collapse: collapse; }
    th { background: #fafaf9; padding: 10px 14px; text-align: right; font-size: 12px; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 12px 14px; font-size: 13px; border-bottom: 1px solid #f5f5f4; vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tr:hover td { background: #fafaf9; }

    /* Badge */
    .badge {
      display: inline-flex; align-items: center; padding: 3px 8px;
      border-radius: 20px; font-size: 11px; font-weight: 600;
    }
    .badge-green { background: #dcfce7; color: #16a34a; }
    .badge-red { background: #fee2e2; color: var(--danger); }
    .badge-yellow { background: #fef9c3; color: #854d0e; }
    .badge-blue { background: #dbeafe; color: #1d4ed8; }
    .badge-gray { background: #f5f5f4; color: var(--text-muted); }
    .badge-orange { background: #ffedd5; color: var(--primary); }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,0.4);
      display: flex; align-items: center; justify-content: center; z-index: 500;
    }
    .modal {
      background: var(--white); border-radius: 16px; width: 90%; max-width: 620px;
      max-height: 88vh; overflow-y: auto; box-shadow: 0 20px 60px rgba(0,0,0,0.15);
    }
    .modal-header {
      padding: 18px 20px; border-bottom: 1px solid var(--border);
      display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; background: var(--white);
    }
    .modal-header h3 { font-size: 17px; font-weight: 700; }
    .modal-body { padding: 20px; }
    .modal-footer { padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; justify-content: flex-end; }
    .close-btn { background: none; border: none; font-size: 20px; cursor: pointer; color: var(--text-muted); }
    .close-btn:hover { color: var(--text); }

    /* Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group.full { grid-column: 1 / -1; }
    .form-group label { font-size: 12px; font-weight: 600; color: var(--text-muted); }
    .form-group input, .form-group select, .form-group textarea {
      border: 1px solid var(--border); border-radius: 8px; padding: 9px 12px;
      font-size: 13px; color: var(--text); background: var(--white);
      transition: border 0.15s; outline: none; direction: rtl;
      font-family: inherit;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color: var(--primary);
    }
    .form-group textarea { resize: vertical; min-height: 72px; }
    .form-section-title { font-size: 13px; font-weight: 700; color: var(--text-muted); margin: 8px 0 4px; grid-column: 1/-1; border-bottom: 1px solid var(--border); padding-bottom: 4px; }

    /* Search */
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    .search-input {
      flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 8px 12px;
      font-size: 13px; outline: none; direction: rtl;
    }
    .search-input:focus { border-color: var(--primary); }

    /* Alert */
    .alert { padding: 12px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .alert-success { background: #dcfce7; color: #15803d; border: 1px solid #bbf7d0; }
    .alert-error { background: #fee2e2; color: #b91c1c; border: 1px solid #fecaca; }

    /* Empty state */
    .empty-state { text-align: center; padding: 48px 20px; color: var(--text-muted); }
    .empty-state .empty-icon { font-size: 42px; margin-bottom: 10px; }
    .empty-state h3 { font-size: 16px; color: var(--text); margin-bottom: 6px; }
    .empty-state p { font-size: 13px; }

    /* Loading */
    .loading { text-align: center; padding: 40px; color: var(--text-muted); font-size: 14px; }
    .spinner { display: inline-block; width: 20px; height: 20px; border: 2px solid var(--border); border-top-color: var(--primary); border-radius: 50%; animation: spin 0.7s linear infinite; margin-left: 8px; }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Tabs */
    .tabs { display: flex; gap: 4px; margin-bottom: 16px; border-bottom: 1px solid var(--border); }
    .tab { padding: 8px 14px; font-size: 13px; font-weight: 500; cursor: pointer; border-bottom: 2px solid transparent; color: var(--text-muted); transition: all 0.15s; }
    .tab.active { border-bottom-color: var(--primary); color: var(--primary); }
    .tab:hover:not(.active) { color: var(--text); }

    /* Filter bar */
    .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 14px; }
    .filter-btn { padding: 5px 12px; border-radius: 20px; font-size: 12px; cursor: pointer; border: 1px solid var(--border); background: var(--white); color: var(--text-muted); transition: all 0.15s; }
    .filter-btn.active { background: var(--primary); color: white; border-color: var(--primary); }

    /* Actions menu in table */
    .action-btn { background: none; border: none; cursor: pointer; font-size: 14px; padding: 4px 8px; border-radius: 6px; color: var(--text-muted); }
    .action-btn:hover { background: #f5f5f4; color: var(--text); }
    .action-btn.del:hover { background: #fee2e2; color: var(--danger); }

    /* Responsive */
    @media (max-width: 768px) {
      #sidebar { display: none; }
      #main { margin-right: 0; padding: 16px; }
      .form-grid { grid-template-columns: 1fr; }
      .stat-grid { grid-template-columns: 1fr 1fr; }
    }

    /* Tasks */
    .task-card { background: var(--white); border: 1px solid var(--border); border-radius: 12px; padding: 14px 16px; margin-bottom: 10px; cursor: pointer; transition: all 0.15s; }
    .task-card:hover { border-color: var(--primary); box-shadow: 0 2px 8px rgba(234,88,12,0.08); }
    .task-card-header { display: flex; justify-content: space-between; align-items: flex-start; }
    .task-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
    .task-card p { font-size: 12px; color: var(--text-muted); }
    .task-card-meta { display: flex; gap: 8px; margin-top: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>

<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

// ── Supabase connection ──────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ustnvbxuuiwioyxnllgf.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVzdG52Ynh1dWl3aW95eG5sbGdmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzc3MTk1MzgsImV4cCI6MjA5MzI5NTUzOH0.VBYX2JTWe69u1uBrNiNif1IEKMkKfax6gRB1Zl3uC6o';
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// ── Helpers ──────────────────────────────────────────────────────────────────
function fmt(v) { return v || '—'; }
function fmtDate(d) { return d ? new Date(d).toLocaleDateString('he-IL') : '—'; }

const STATUS_LABELS = {
  equipment: { active: 'פעיל', inactive: 'לא פעיל', maintenance: 'בתחזוקה' },
  employee:  { active: 'פעיל', inactive: 'לא פעיל', vacation: 'חופשה', sick: 'מחלה' },
  order:     { pending: 'ממתין', approved: 'אושר', active: 'בביצוע', completed: 'הושלם', cancelled: 'בוטל' },
  task:      { open: 'פתוח', in_progress: 'בביצוע', done: 'הושלם', cancelled: 'בוטל' },
};

const STATUS_BADGE = {
  active: 'badge-green', inactive: 'badge-red', maintenance: 'badge-yellow',
  vacation: 'badge-yellow', sick: 'badge-red',
  pending: 'badge-yellow', approved: 'badge-blue', in_progress: 'badge-blue',
  completed: 'badge-green', cancelled: 'badge-gray', done: 'badge-green', open: 'badge-orange',
};

function Badge({ val, type }) {
  const label = STATUS_LABELS[type]?.[val] || val || '—';
  const cls = STATUS_BADGE[val] || 'badge-gray';
  return <span className={`badge ${cls}`}>{label}</span>;
}

// ── Toast ─────────────────────────────────────────────────────────────────────
function useToast() {
  const [toast, setToast] = useState(null);
  const show = (msg, type='success') => {
    setToast({ msg, type });
    setTimeout(() => setToast(null), 3500);
  };
  return { toast, show };
}
function Toast({ toast }) {
  if (!toast) return null;
  return (
    <div style={{
      position:'fixed', bottom:24, left:'50%', transform:'translateX(-50%)',
      background: toast.type==='error' ? '#dc2626' : '#16a34a',
      color:'white', padding:'10px 20px', borderRadius:10, fontSize:14,
      boxShadow:'0 4px 20px rgba(0,0,0,0.15)', zIndex:9999, whiteSpace:'nowrap'
    }}>{toast.msg}</div>
  );
}

// ── Confirm delete dialog ─────────────────────────────────────────────────────
function ConfirmDialog({ msg, onYes, onNo }) {
  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:360}}>
        <div className="modal-body" style={{textAlign:'center', padding:'30px 20px'}}>
          <div style={{fontSize:36, marginBottom:10}}>⚠️</div>
          <p style={{fontSize:15, marginBottom:20}}>{msg}</p>
          <div style={{display:'flex', gap:10, justifyContent:'center'}}>
            <button className="btn btn-outline" onClick={onNo}>ביטול</button>
            <button className="btn btn-danger" onClick={onYes}>מחק</button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// HOME PAGE
// ══════════════════════════════════════════════════════════════════════════════
function HomePage({ navigate }) {
  const [counts, setCounts] = useState({ equipment:0, employees:0, orders:0, tasks:0, active_eq:0, active_emp:0 });
  const [loading, setLoading] = useState(true);
  const [recentOrders, setRecentOrders] = useState([]);

  useEffect(() => {
    async function load() {
      const [eq, emp, ord, tsk] = await Promise.all([
        supabase.from('equipment').select('id,equipment_status'),
        supabase.from('employees').select('id,employee_status'),
        supabase.from('orders').select('id,order_number,project_name,client_name,start_date,status').order('created_at',{ascending:false}).limit(5),
        supabase.from('tasks').select('id'),
      ]);
      setCounts({
        equipment: eq.data?.length||0,
        employees: emp.data?.length||0,
        orders: ord.data?.length||0,
        tasks: tsk.data?.length||0,
        active_eq: eq.data?.filter(e=>e.equipment_status==='active').length||0,
        active_emp: emp.data?.filter(e=>e.employee_status==='active').length||0,
      });
      setRecentOrders(ord.data||[]);
      setLoading(false);
    }
    load();
  }, []);

  const stats = [
    { label: 'כלים וציוד', value: counts.equipment, sub: `${counts.active_eq} פעילים`, icon: '🏗️', bg:'#ffedd5', page:'equipment' },
    { label: 'עובדים', value: counts.employees, sub: `${counts.active_emp} פעילים`, icon: '👷', bg:'#dbeafe', page:'employees' },
    { label: 'הזמנות', value: counts.orders, sub: 'סה"כ הזמנות', icon: '📋', bg:'#dcfce7', page:'orders' },
    { label: 'משימות', value: counts.tasks, sub: 'סה"כ משימות', icon: '✅', bg:'#fef9c3', page:'tasks' },
  ];

  if (loading) return <div className="loading"><div className="spinner"></div> טוען נתונים...</div>;

  return (
    <div>
      <div className="page-header">
        <div>
          <h2>דף הבית</h2>
          <p>סיכום מצב הצי ופעילות שוטפת</p>
        </div>
      </div>

      <div className="stat-grid">
        {stats.map(s => (
          <div key={s.label} className="stat-card" style={{cursor:'pointer'}} onClick={()=>navigate(s.page)}>
            <div className="stat-icon" style={{background:s.bg}}>{s.icon}</div>
            <div className="stat-info">
              <h3>{s.value}</h3>
              <p style={{fontWeight:600, fontSize:13, color:'#1c1917'}}>{s.label}</p>
              <p>{s.sub}</p>
            </div>
          </div>
        ))}
      </div>

      <div className="table-card">
        <div className="table-header">
          <h3>הזמנות אחרונות</h3>
          <button className="btn btn-outline btn-sm" onClick={()=>navigate('orders')}>כל ההזמנות</button>
        </div>
        {recentOrders.length === 0 ? (
          <div className="empty-state"><p>אין הזמנות עדיין</p></div>
        ) : (
          <table>
            <thead><tr>
              <th>מס׳ הזמנה</th><th>פרויקט</th><th>לקוח</th><th>תאריך התחלה</th><th>סטטוס</th>
            </tr></thead>
            <tbody>
              {recentOrders.map(o => (
                <tr key={o.id}>
                  <td><strong>{fmt(o.order_number)}</strong></td>
                  <td>{fmt(o.project_name)}</td>
                  <td>{fmt(o.client_name)}</td>
                  <td>{fmtDate(o.start_date)}</td>
                  <td><Badge val={o.status} type="order" /></td>
                </tr>
              ))}
            </tbody>
          </table>
        )}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// EQUIPMENT PAGE
// ══════════════════════════════════════════════════════════════════════════════
const EQ_STATUS_OPTIONS = [
  {value:'active', label:'פעיל'},
  {value:'inactive', label:'לא פעיל'},
  {value:'maintenance', label:'בתחזוקה'},
];


function EquipmentModal({ item, equipmentTypes, onClose, onSave }) {
  const blank = {
    name:'', equipment_number:'', mia_number:'', license_number:'',
    chassis_number:'', manufacture_year:'', manufacturer:'', model:'',
    dedicated_type:'', crane_size:'',
    license_date:'', inspector_date:'', transport_license_date:'',
    equipment_status:'active', bonus_percentage:'', activity_section:'', operator_section:'',
    notes:'',
  };
  const [form, setForm] = useState(item ? {...blank,...item} : blank);
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f => ({...f,[k]:v}));

  async function handleSave() {
    if (!form.name.trim()) { alert('שם הכלי הוא שדה חובה'); return; }
    setSaving(true);
    const data = {
      name: form.name,
      equipment_number: form.equipment_number,
      mia_number: form.mia_number,
      license_number: form.license_number,
      chassis_number: form.chassis_number,
      manufacture_year: form.manufacture_year,
      manufacturer: form.manufacturer,
      model: form.model,
      dedicated_type: form.dedicated_type,
      crane_size: form.crane_size,
      license_date: form.license_date || null,
      inspector_date: form.inspector_date || null,
      transport_license_date: form.transport_license_date || null,
      equipment_status: form.equipment_status,
      bonus_percentage: form.bonus_percentage,
      activity_section: form.activity_section,
      operator_section: form.operator_section,
      notes: form.notes,
    };
    let res;
    if (item?.id) {
      res = await supabase.from('equipment').update(data).eq('id', item.id).select();
    } else {
      res = await supabase.from('equipment').insert([data]).select();
    }
    setSaving(false);
    if (res.error) { alert('שגיאה: ' + res.error.message); return; }
    onSave(res.data[0]);
  }

  return (
    <div className="modal-overlay">
      <div className="modal">
        <div className="modal-header">
          <h3>{item ? 'עריכת כלי' : 'הוספת כלי חדש'}</h3>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-grid">

            {/* ── פרק ראשון — זיהוי ── */}
            <div className="form-section-title">פרק ראשון — זיהוי הכלי</div>
            <div className="form-group">
              <label>מספר ציוד</label>
              <input value={form.equipment_number} onChange={e=>set('equipment_number',e.target.value)} placeholder="מספר פנימי" />
            </div>
            <div className="form-group">
              <label>שם הכלי *</label>
              <input value={form.name} onChange={e=>set('name',e.target.value)} placeholder="שם הכלי" />
            </div>
            <div className="form-group">
              <label>מספר מי"ה</label>
              <input value={form.mia_number} onChange={e=>set('mia_number',e.target.value)} />
            </div>
            <div className="form-group">
              <label>מספר רישוי</label>
              <input value={form.license_number} onChange={e=>set('license_number',e.target.value)} />
            </div>
            <div className="form-group">
              <label>מספר שלדה</label>
              <input value={form.chassis_number} onChange={e=>set('chassis_number',e.target.value)} />
            </div>
            <div className="form-group">
              <label>שנת ייצור</label>
              <input value={form.manufacture_year} onChange={e=>set('manufacture_year',e.target.value)} placeholder="2015" />
            </div>

function EquipmentPage() {
  const [items, setItems] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('all');
  const [modal, setModal] = useState(null); // null | 'add' | item
  const [delTarget, setDelTarget] = useState(null);
  const [equipmentTypes, setEquipmentTypes] = useState([]);
  const { toast, show } = useToast();

  // Load equipment types from lookup_lists
  useEffect(() => {
    supabase.from('lookup_lists')
      .select('value')
      .eq('list_name','equipment_types')
      .order('sort_order')
      .then(({data}) => setEquipmentTypes((data||[]).map(r=>r.value)));
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    const { data, error } = await supabase.from('equipment').select('*').order('name');
    if (!error) setItems(data || []);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  const filtered = items.filter(e => {
    const q = search.toLowerCase();
    const matchSearch = !q || e.name?.toLowerCase().includes(q) || e.equipment_number?.toLowerCase().includes(q) || e.mia_number?.toLowerCase().includes(q);
    const matchStatus = filterStatus === 'all' || e.equipment_status === filterStatus;
    return matchSearch && matchStatus;
  });

  async function handleDelete() {
    const { error } = await supabase.from('equipment').delete().eq('id', delTarget.id);
    if (error) { show('שגיאה במחיקה', 'error'); }
    else { show('הכלי נמחק בהצלחה'); setItems(p => p.filter(e => e.id !== delTarget.id)); }
    setDelTarget(null);
  }

  function handleSaved(saved) {
    setItems(prev => {
      const idx = prev.findIndex(e => e.id === saved.id);
      if (idx >= 0) { const n=[...prev]; n[idx]=saved; return n; }
      return [...prev, saved];
    });
    setModal(null);
    show(modal?.id ? 'הכלי עודכן בהצלחה' : 'הכלי נוסף בהצלחה');
  }

  const DEDICATED_LABEL = { crane:'מנוף', heavy:'ציוד כבד', light:'ציוד קל', vehicle:'רכב', other:'אחר' };

  // ── Export to CSV ──
  function handleExport() {
    const cols = [
      ['equipment_number','מספר ציוד'],['name','תיאור'],['mia_number','מספר מי"ה'],
      ['license_number','מספר רישוי'],['chassis_number','מספר שלדה'],
      ['manufacture_year','שנת ייצור'],['manufacturer','יצרן'],['model','דגם'],
      ['dedicated_type','סוג כלי'],['crane_size','גודל'],
      ['license_date','תאריך רישוי'],['inspector_date','תאריך בדיקה'],
      ['transport_license_date','רישיון הובלה'],
      ['equipment_status','סטטוס'],['bonus_percentage','אחוזי פרמיה'],
      ['activity_section','סעיף פרמיה'],['operator_section','פעילות כלי'],['notes','הערות'],
    ];
    const header = cols.map(c=>c[1]).join(',');
    const rows = items.map(e =>
      cols.map(([k]) => {
        const v = e[k] ?? '';
        return String(v).includes(',') || String(v).includes('\n') ? `"${String(v).replace(/"/g,'""')}"` : String(v);
      }).join(',')
    );
    const csv = '﻿' + header + '\n' + rows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `כלים_${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.csv`;
    a.click();
  }

  // ── Import from CSV ──
  const importRef = React.useRef();
  function handleImportClick() { importRef.current.value=''; importRef.current.click(); }

  async function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    const clean = text.replace(/^﻿/,'');
    const lines = clean.split(/\r?\n/).filter(l=>l.trim());
    if (lines.length < 2) { show('הקובץ ריק או לא תקין','error'); return; }

    const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    const COL = {
      'מספר ציוד':'equipment_number','תיאור':'name','מספר מי"ה':'mia_number',
      'מספר רישוי':'license_number','מספר שלדה':'chassis_number',
      'שנת ייצור':'manufacture_year','יצרן':'manufacturer','דגם':'model',
      'סוג כלי':'dedicated_type','גודל':'crane_size',
      'תאריך רישוי':'license_date','תאריך בדיקה':'inspector_date',
      'רישיון הובלה':'transport_license_date',
      'סטטוס':'equipment_status','אחוזי פרמיה':'bonus_percentage',
      'סעיף פרמיה':'activity_section','פעילות כלי':'operator_section','הערות':'notes',
    };

    function parseLine(line) {
      const fields=[]; let cur=''; let inQ=false;
      for (let i=0;i<line.length;i++) {
        const c=line[i];
        if(c==='"'){if(inQ&&line[i+1]==='"'){cur+='"';i++;}else inQ=!inQ;}
        else if(c===','&&!inQ){fields.push(cur);cur='';}
        else cur+=c;
      }
      fields.push(cur);
      return fields;
    }

    const STATUS_MAP = {'active':'active','inactive':'inactive','maintenance':'maintenance','breakdown':'breakdown','לא נמכר':'active','תקלה':'breakdown'};

    const records = [];
    for (let i=1;i<lines.length;i++) {
      const vals = parseLine(lines[i]);
      if (vals.length < 2) continue;
      const obj = {};
      headers.forEach((h,idx) => { const f=COL[h]; if(f) obj[f]=vals[idx]?.trim()||''; });
      if (!obj.name && !obj.equipment_number) continue;
      obj.equipment_status = STATUS_MAP[obj.equipment_status] || 'active';
      ['license_date','inspector_date','transport_license_date'].forEach(k=>{if(!obj[k])obj[k]=null;});
      if (obj.manufacture_year) obj.manufacture_year = parseInt(obj.manufacture_year)||null;
      if (obj.crane_size) obj.crane_size = parseFloat(obj.crane_size)||null;
      if (obj.bonus_percentage) obj.bonus_percentage = parseFloat(obj.bonus_percentage)||null;
      records.push(obj);
    }

    if (records.length===0) { show('לא נמצאו שורות תקינות','error'); return; }
    if (!window.confirm(`נמצאו ${records.length} כלים לייבוא. להמשיך?`)) return;

    const { data, error } = await supabase.from('equipment').insert(records).select();
    if (error) { show('שגיאת ייבוא: '+error.message,'error'); return; }
    show(`יובאו ${data.length} כלים בהצלחה!`);
    load();
  }

  return (
    <div>
      <Toast toast={toast} />
      {modal && <EquipmentModal item={modal==='add'?null:modal} equipmentTypes={equipmentTypes} onClose={()=>setModal(null)} onSave={handleSaved} />}
      {delTarget && <ConfirmDialog msg={`למחוק את "${delTarget.name}"?`} onYes={handleDelete} onNo={()=>setDelTarget(null)} />}
      <input ref={importRef} type="file" accept=".csv" style={{display:'none'}} onChange={handleImportFile}/>

      <div className="page-header">
        <div><h2>כלים וציוד</h2><p>ניהול ציוד ומנופים</p></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={handleImportClick}>📥 ייבוא CSV</button>
          <button className="btn btn-outline" onClick={handleExport}>📤 ייצוא CSV</button>
          <button className="btn btn-primary" onClick={()=>setModal('add')}>+ הוסף כלי</button>
        </div>
      </div>

      <div className="search-box">
        <input className="search-input" placeholder={'🔍 חיפוש לפי שם, מספר כלי, מי"ה...'} value={search} onChange={e=>setSearch(e.target.value)} />
      </div>

      <div className="filter-bar">
        {[['all','הכל'],['active','פעילים'],['inactive','לא פעילים'],['maintenance','בתחזוקה']].map(([v,l])=>(
          <button key={v} className={`filter-btn${filterStatus===v?' active':''}`} onClick={()=>setFilterStatus(v)}>{l}</button>
        ))}
      </div>

      {loading ? <div className="loading"><div className="spinner"></div> טוען...</div> : (
        <div className="table-card">
          <div className="table-header">
            <h3>כלים ({filtered.length})</h3>
          </div>
          {filtered.length === 0 ? (
            <div className="empty-state">
              <div className="empty-icon">🏗️</div>
              <h3>{search || filterStatus!=='all' ? 'לא נמצאו תוצאות' : 'אין כלים עדיין'}</h3>
              {!search && filterStatus==='all' && <p>לחץ על "הוסף כלי" כדי להתחיל</p>}
            </div>
          ) : (
            <table>
              <thead><tr>
                <th>שם הכלי</th><th>מספר כלי</th><th>סוג</th><th>מנוף/גודל</th>
                <th>מס׳ מי"ה</th><th>יצרן/דגם</th><th>שנה</th><th>סטטוס</th><th>פעולות</th>
              </tr></thead>
              <tbody>
                {filtered.map(e => (
                  <tr key={e.id}>
                    <td><strong>{e.name}</strong></td>
                    <td>{fmt(e.equipment_number)}</td>
                    <td>{DEDICATED_LABEL[e.dedicated_type] || fmt(e.dedicated_type)}</td>
                    <td>{fmt(e.crane_size)}</td>
                    <td>{fmt(e.mia_number)}</td>
                    <td>{[e.manufacturer,e.model].filter(Boolean).join(' / ') || '—'}</td>
                    <td>{fmt(e.manufacture_year)}</td>
                    <td><Badge val={e.equipment_status} type="equipment" /></td>
                    <td>
                      <button className="action-btn" title="ערוך" onClick={()=>setModal(e)}>✏️</button>
                      <button className="action-btn del" title="מחק" onClick={()=>setDelTarget(e)}>🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

    setForm(f => ({

  const filtered = items.filter(e => {
    const q = search.toLowerCase();
    const matchSearch = !q || e.full_name?.toLowerCase().includes(q) || e.mia_number_old?.toLowerCase().includes(q) || e.mia_number_new?.toLowerCase().includes(q);
    const matchStatus = filterStatus==='all' || e.employee_status===filterStatus;
    return matchSearch && matchStatus;
  });

  async function handleDelete() {
    const { error } = await supabase.from('employees').delete().eq('id', delTarget.id);
    if (error) show('שגיאה במחיקה','error');
    else { show('העובד נמחק'); setItems(p=>p.filter(e=>e.id!==delTarget.id)); }
    setDelTarget(null);
  }

  function handleSaved(saved) {
    setItems(prev => {
      const idx=prev.findIndex(e=>e.id===saved.id);
      if(idx>=0){const n=[...prev];n[idx]=saved;return n;}
      return [...prev,saved];
    });
    setModal(null);
    show(modal?.id?'העובד עודכן':'העובד נוסף');
  }

  const ROLE_LABEL = {operator:'מפעיל',driver:'נהג',mechanic:'מכונאי',supervisor:'מפקח',manager:'מנהל',other:'אחר'};
  const ROLE_FROM_HE = {'מפעיל':'operator','נהג':'driver','מכונאי':'mechanic','מפקח':'supervisor','מנהל':'manager','מנהל עבודה':'supervisor','רי"ח תפעול צמ"ה':'manager'};

  // ── Export to CSV (opens in Excel with Hebrew) ──
  function handleExport() {
    const cols = [
      ['full_name','שם מלא'],['mia_number_old','מספר אישי'],['mia_number_new','מספר כיל'],
      ['role','תפקיד'],['job_title','תפקיד מפורט'],['employee_status','סטטוס'],
      ['phone','טלפון נייד'],['phone2','טלפון נוסף'],['phone3','טלפון שלישי'],
      ['birth_date','תאריך לידה'],['start_date','תאריך תחילת עבודה'],
      ['license_expiry','תוקף רישיון'],['affiliation','שיוך'],
      ['manager_name','מנהל'],['address','כתובת'],['notes','הערות'],
    ];
    const header = cols.map(c=>c[1]).join(',');
    const rows = items.map(e =>
      cols.map(([k]) => {
        const v = e[k] ?? '';
        // Wrap in quotes if contains comma or newline
        return String(v).includes(',') || String(v).includes('\n') ? `"${String(v).replace(/"/g,'""')}"` : String(v);
      }).join(',')
    );
    const csv = '﻿' + header + '\n' + rows.join('\n');
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = `עובדים_${new Date().toLocaleDateString('he-IL').replace(/\//g,'-')}.csv`;
    a.click();
  }

  // ── Import from CSV ──
  const importRef = React.useRef();
  function handleImportClick() { importRef.current.value=''; importRef.current.click(); }

  async function handleImportFile(e) {
    const file = e.target.files[0];
    if (!file) return;
    const text = await file.text();
    // Remove BOM if present
    const clean = text.replace(/^﻿/,'');
    const lines = clean.split(/\r?\n/).filter(l=>l.trim());
    if (lines.length < 2) { show('הקובץ ריק או לא תקין','error'); return; }

    // Parse header
    const headers = lines[0].split(',').map(h=>h.trim().replace(/^"|"$/g,''));
    const COL = {
      'שם מלא':'full_name','מספר אישי':'mia_number_old','מספר כיל':'mia_number_new',
      'תפקיד':'role','תפקיד מפורט':'job_title','סטטוס':'employee_status',
      'טלפון נייד':'phone','טלפון נוסף':'phone2','טלפון שלישי':'phone3',
      'תאריך לידה':'birth_date','תאריך תחילת עבודה':'start_date',
      'תוקף רישיון':'license_expiry','שיוך':'affiliation',
      'מנהל':'manager_name','כתובת':'address','הערות':'notes',
    };

    // Parse rows — handle quoted fields with commas
    function parseLine(line) {
      const fields = []; let cur = ''; let inQ = false;
      for (let i=0; i<line.length; i++) {
        const c = line[i];
        if (c==='"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; }
        else if (c===',' && !inQ) { fields.push(cur); cur=''; }
        else cur+=c;
      }
      fields.push(cur);
      return fields;
    }

    const STATUS_MAP = {'נוכח':'active','פעיל':'active','לא פעיל':'inactive','inactive':'inactive','active':'active','vacation':'vacation','sick':'sick'};

    const records = [];
    for (let i=1; i<lines.length; i++) {
      const vals = parseLine(lines[i]);
      if (vals.length < 2) continue;
      const obj = {};
      headers.forEach((h,idx) => {
        const field = COL[h];
        if (field) obj[field] = vals[idx]?.trim() || '';
      });
      if (!obj.full_name) continue;
      // Normalize role from Hebrew
      if (obj.role && ROLE_FROM_HE[obj.role]) obj.role = ROLE_FROM_HE[obj.role];
      if (!['operator','driver','mechanic','supervisor','manager','other'].includes(obj.role)) obj.role='operator';
      // Normalize status
      obj.employee_status = STATUS_MAP[obj.employee_status] || 'active';
      // Empty dates → null
      ['birth_date','start_date','license_expiry'].forEach(k=>{ if(!obj[k]) obj[k]=null; });
      obj.license_types = [];
      records.push(obj);
    }

    if (records.length === 0) { show('לא נמצאו שורות תקינות','error'); return; }

    const confirm = window.confirm(`נמצאו ${records.length} עובדים לייבוא. להמשיך?`);
    if (!confirm) return;

    const { data, error } = await supabase.from('employees').insert(records).select();
    if (error) { show('שגיאת ייבוא: ' + error.message, 'error'); return; }
    show(`יובאו ${data.length} עובדים בהצלחה!`);
    load();
  }

  return (
    <div>
      <Toast toast={toast}/>
      {modal && <EmployeeModal item={modal==='add'?null:modal} licenseTypes={licenseTypes} onClose={()=>setModal(null)} onSave={handleSaved}/>}
      {delTarget && <ConfirmDialog msg={`למחוק את "${delTarget.full_name}"?`} onYes={handleDelete} onNo={()=>setDelTarget(null)}/>}
      {/* Hidden file input for import */}
      <input ref={importRef} type="file" accept=".csv" style={{display:'none'}} onChange={handleImportFile}/>

      <div className="page-header">
        <div><h2>עובדים</h2><p>ניהול עובדים ומפעילים</p></div>
        <div style={{display:'flex',gap:8}}>
          <button className="btn btn-outline" onClick={handleImportClick} title="ייבוא מ-CSV">📥 ייבוא CSV</button>
          <button className="btn btn-outline" onClick={handleExport} title="ייצוא ל-CSV">📤 ייצוא CSV</button>
          <button className="btn btn-primary" onClick={()=>setModal('add')}>+ הוסף עובד</button>
        </div>
      </div>

      <div className="search-box">
        <input className="search-input" placeholder={'🔍 חיפוש לפי שם, מספר מי"ה...'} value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="filter-bar">
        {[['all','הכל'],['active','פעילים'],['inactive','לא פעילים'],['vacation','חופשה'],['sick','מחלה']].map(([v,l])=>(
          <button key={v} className={`filter-btn${filterStatus===v?' active':''}`} onClick={()=>setFilterStatus(v)}>{l}</button>
        ))}
      </div>

      {loading ? <div className="loading"><div className="spinner"></div> טוען...</div> : (
        <div className="table-card">
          <div className="table-header"><h3>עובדים ({filtered.length})</h3></div>
          {filtered.length===0 ? (
            <div className="empty-state">
              <div className="empty-icon">👷</div>
              <h3>{search||filterStatus!=='all'?'לא נמצאו תוצאות':'אין עובדים עדיין'}</h3>
              {!search&&filterStatus==='all'&&<p>לחץ על "הוסף עובד" כדי להתחיל</p>}
            </div>
          ) : (
            <table>
              <thead><tr>
                <th>שם מלא</th><th>תפקיד</th><th>טלפון</th><th>מי"ה ישן</th><th>מי"ה חדש</th>
                <th>תחילת עבודה</th><th>תוקף רישיון</th><th>סטטוס</th><th>פעולות</th>
              </tr></thead>
              <tbody>
                {filtered.map(e=>(
                  <tr key={e.id}>
                    <td><strong>{e.full_name}</strong></td>
                    <td>{ROLE_LABEL[e.role]||fmt(e.role)}{e.job_title?<><br/><small style={{color:'var(--text-muted)'}}>{e.job_title}</small></>:null}</td>
                    <td>{fmt(e.phone)}</td>
                    <td>{fmt(e.mia_number_old)}</td>
                    <td>{fmt(e.mia_number_new)}</td>
                    <td>{fmtDate(e.start_date)}</td>
                    <td style={{color: e.license_expiry && new Date(e.license_expiry)<new Date() ? 'var(--danger)' : 'inherit'}}>
                      {fmtDate(e.license_expiry)}
                    </td>
                    <td><Badge val={e.employee_status} type="employee"/></td>
                    <td>
                      <button className="action-btn" onClick={()=>setModal(e)}>✏️</button>
                      <button className="action-btn del" onClick={()=>setDelTarget(e)}>🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
          )}
        </div>
      )}
    </div>
  );
}

// ORDERS PAGE
// ══════════════════════════════════════════════════════════════════════════════
function OrderModal({ item, equipment, employees, onClose, onSave }) {
  const ORDER_STATUS = [
    {value:'pending',label:'ממתין'},{value:'approved',label:'אושר'},
    {value:'active',label:'בביצוע'},{value:'completed',label:'הושלם'},{value:'cancelled',label:'בוטל'},
  ];

  const blank = {
    order_number_display:'', status:'pending', is_external_equipment: false,
    equipment_id:'', equipment_type:'', equipment_size:'', supplier_name:'',
    start_date:'', end_date:'', start_time:'', end_time:'',
    location:'', description:'', admin_notes:'',
    client_name:'', client_phone:'', client_email:'',
    site_manager:'', po_number:'',
  };

  // If historical order has mia_number but no equipment_id (or equipment_id IS a mia_number),
  // resolve the real UUID equipment_id from the equipment list
  function resolveEquipmentId(orderItem) {
    if (!orderItem) return '';
    // Check if equipment_id is already a valid UUID in our equipment list
    if (orderItem.equipment_id && equipment.find(e => e.id === orderItem.equipment_id)) {
      return orderItem.equipment_id;
    }
    // equipment_id may be a mia_number (historical import) — resolve to real UUID
    if (orderItem.equipment_id) {
      const byMia = equipment.find(e => String(e.mia_number) === String(orderItem.equipment_id));
      if (byMia) return byMia.id;
    }
    // Try mia_number field
    if (orderItem.mia_number) {
      const found = equipment.find(e => String(e.mia_number) === String(orderItem.mia_number));
      if (found) return found.id;
    }
    return '';
  }

  const initForm = item ? {...blank, ...item, equipment_id: resolveEquipmentId(item)} : blank;
  const [form, setForm] = useState(initForm);
  const [operators, setOperators] = useState([]);
  const [authorizedClients, setAuthorizedClients] = useState([]);
  const [orderStatusOptions, setOrderStatusOptions] = useState([]);
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  // Load authorized clients, order statuses + existing operators if editing
  useEffect(() => {
    supabase.from('authorized_clients').select('id,full_name,phone,email').eq('is_active',true).order('full_name')
      .then(({data}) => setAuthorizedClients(data||[]));
    supabase.from('lookup_lists').select('value').eq('list_name','order_status').order('sort_order')
      .then(({data}) => setOrderStatusOptions((data||[]).map(r=>r.value)));

    if (item?.id) {
      supabase.from('order_operators').select('*').eq('order_id', item.id).order('created_at')
        .then(({data}) => setOperators(data||[]));
    }
  }, [item?.id]);

  // Generate next order number for new orders
  useEffect(() => {
    if (!item?.id && !form.order_number_display) {
      const year = new Date().getFullYear();
      supabase.from('orders').select('order_number_display').like('order_number_display', `${year}-%`)
        .then(({data}) => {
          const nums = (data||[]).map(r => parseInt((r.order_number_display||'').split('-')[1]||0)).filter(n=>!isNaN(n));
          const next = nums.length ? Math.max(...nums)+1 : 1;
          set('order_number_display', `${year}-${String(next).padStart(3,'0')}`);
        });
    }
  }, []);

  // Select client from authorized list
  function selectClient(id) {
    if (!id) return;
    const c = authorizedClients.find(c=>c.id===id);
    if (c) { set('client_name', c.full_name); set('client_phone', c.phone||''); set('client_email', c.email||''); }
  }

  // Operators management
  function addOperator(empId) {
    if (!empId) return;
    const emp = employees.find(e=>e.id===empId);
    if (!emp) return;
    if (operators.find(o=>o.employee_id===empId)) return; // already added
    setOperators(prev=>[...prev, { employee_id:empId, employee_name:emp.full_name, role:emp.role||'', start_time:'', end_time:'', _new:true }]);
  }

  function removeOperator(idx) {
    setOperators(prev=>prev.filter((_,i)=>i!==idx));
  }

  function updateOperator(idx, field, val) {
    setOperators(prev=>prev.map((o,i)=>i===idx?{...o,[field]:val}:o));
  }

  async function handleSave() {
    if (!form.start_date) { alert('תאריך התחלה הוא שדה חובה'); return; }
    setSaving(true);

    // Save order — strip non-column fields before sending to DB
    const data = {...form};
    ['equipment_id'].forEach(k => { if(!data[k]) data[k]=null; });
    delete data.id; delete data.created_at; delete data.order_operators;

    let orderId = item?.id;
    let savedOrder;
    if (item?.id) {
      const res = await supabase.from('orders').update(data).eq('id',item.id).select().single();
      if (res.error) { alert('שגיאה: '+res.error.message); setSaving(false); return; }
      savedOrder = res.data;
    } else {
      const res = await supabase.from('orders').insert([data]).select().single();
      if (res.error) { alert('שגיאה: '+res.error.message); setSaving(false); return; }
      savedOrder = res.data;
      orderId = savedOrder.id;
    }

    // Save operators: delete all existing, re-insert
    if (orderId) {
      await supabase.from('order_operators').delete().eq('order_id', orderId);
      if (operators.length > 0) {
        const inserts = operators.map(o=>({
          order_id: orderId,
          employee_id: o.employee_id,
          employee_name: o.employee_name,
          start_time: o.start_time||null,
          end_time: o.end_time||null,
          work_date: form.start_date||null,
          bonus_percentage: o.bonus_percentage||null,
        }));
        const { error } = await supabase.from('order_operators').insert(inserts);
        if (error) { alert('שגיאה בשמירת מפעילים: '+error.message); setSaving(false); return; }
      }
    }

    setSaving(false);
    onSave(savedOrder);
  }

  const sectionStyle = {
    background:'var(--primary-light)', borderRadius:10, padding:'14px 16px',
    marginBottom:16, border:'1px solid var(--primary-light)'
  };
  const sectionTitle = {
    fontSize:14, fontWeight:700, color:'var(--primary-dark)',
    marginBottom:12, display:'flex', alignItems:'center', gap:6
  };

  return (
    <div className="modal-overlay">
      <div className="modal" style={{maxWidth:680}}>
        <div className="modal-header">
          <h3>{item?`עריכת הזמנה ${item.order_number_display||''}` : 'הזמנה חדשה'}</h3>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">

          {/* ── 1. בחירת כלי ── */}
          <div style={sectionStyle}>
            <div style={sectionTitle}>🏗️ בחירת כלי</div>
            <div style={{display:'flex',gap:8,marginBottom:12}}>
              <button type="button"
                onClick={()=>set('is_external_equipment',false)}
                style={{flex:1,padding:'8px',borderRadius:8,border:'2px solid',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,
                        borderColor:!form.is_external_equipment?'var(--primary)':'var(--border)',
                        background:!form.is_external_equipment?'var(--primary)':'white',
                        color:!form.is_external_equipment?'white':'var(--text)'}}>
                כלי מחצי
              </button>
              <button type="button"
                onClick={()=>set('is_external_equipment',true)}
                style={{flex:1,padding:'8px',borderRadius:8,border:'2px solid',cursor:'pointer',fontFamily:'inherit',fontSize:13,fontWeight:600,
                        borderColor:form.is_external_equipment?'var(--primary)':'var(--border)',
                        background:form.is_external_equipment?'var(--primary)':'white',
                        color:form.is_external_equipment?'white':'var(--text)'}}>
                כלי חיצוני מזמן
              </button>
            </div>

            {!form.is_external_equipment ? (
              <div className="form-group">
                <label>בחר כלי להזמנה</label>
                <select value={form.equipment_id||''} onChange={e=>set('equipment_id',e.target.value)}>
                  <option value="">— בחר כלי —</option>
                  {equipment.map(eq=><option key={eq.id} value={eq.id}>{eq.name}{eq.equipment_number?` (${eq.equipment_number})`:''}</option>)}
                </select>
              </div>
            ) : (
              <div className="form-grid">
                <div className="form-group">
                  <label>סוג הכלי</label>
                  <input value={form.equipment_type||''} onChange={e=>set('equipment_type',e.target.value)} placeholder="למשל: מנוף, מחפר..." />
                </div>
                <div className="form-group">
                  <label>גודל הכלי</label>
                  <input value={form.equipment_size||''} onChange={e=>set('equipment_size',e.target.value)} placeholder="למשל: 20 טון, 5 מטר..." />
                </div>
                <div className="form-group full">
                  <label>שם הספק</label>
                  <input value={form.supplier_name||''} onChange={e=>set('supplier_name',e.target.value)} placeholder="שם החברה המספקת" />
                </div>
              </div>
            )}
          </div>

          {/* ── 2. פרטי מזמין ── */}
          <div style={sectionStyle}>
            <div style={sectionTitle}>👤 פרטי המזמין</div>
            <div className="form-group" style={{marginBottom:10}}>
              <label>בחר מזמין מהרשימה</label>
              <select onChange={e=>selectClient(e.target.value)} defaultValue="">
                <option value="">— בחר מזמין מורשה או 'אחר' —</option>
                {authorizedClients.map(c=><option key={c.id} value={c.id}>{c.full_name}</option>)}
              </select>
            </div>
            <div className="form-grid">
              <div className="form-group">
                <label>שם מלא</label>
                <input value={form.client_name||''} onChange={e=>set('client_name',e.target.value)} placeholder="שם המזמין" />
              </div>
              <div className="form-group">
                <label>טלפון</label>
                <input value={form.client_phone||''} onChange={e=>set('client_phone',e.target.value)} placeholder="050-1234567" />
              </div>
              <div className="form-group full">
                <label>אימייל</label>
                <input value={form.client_email||''} onChange={e=>set('client_email',e.target.value)} placeholder="email@example.com" />
              </div>
            </div>
          </div>

          {/* ── 3. פרטי עבודה ── */}
          <div style={{...sectionStyle, background:'#fff8f0', borderColor:'#fed7aa'}}>
            <div style={{...sectionTitle, color:'#c2410c'}}>📋 פרטי העבודה</div>
            <div className="form-grid">
              <div className="form-group">
                <label>שם אחראי בשטח</label>
                <input value={form.site_manager||''} onChange={e=>set('site_manager',e.target.value)} placeholder="שם האחראי" />
              </div>
              <div className="form-group">
                <label>מספר פק"ע</label>
                <input value={form.po_number||''} onChange={e=>set('po_number',e.target.value)} placeholder="מספר הזמנת עבודה" />
              </div>
              <div className="form-group">
                <label>תאריך התחלה *</label>
                <input type="date" value={form.start_date||''} onChange={e=>set('start_date',e.target.value)} />
              </div>
              <div className="form-group">
                <label>תאריך סיום *</label>
                <input type="date" value={form.end_date||''} onChange={e=>set('end_date',e.target.value)} />
              </div>
              <div className="form-group">
                <label>שעת התחלה</label>
                <input type="time" value={form.start_time||''} onChange={e=>set('start_time',e.target.value)} />
              </div>
              <div className="form-group">
                <label>שעת סיום</label>
                <input type="time" value={form.end_time||''} onChange={e=>set('end_time',e.target.value)} />
              </div>
              <div className="form-group full">
                <label>מיקום העבודה</label>
                <input value={form.location||''} onChange={e=>set('location',e.target.value)} placeholder="כתובת או תיאור מיקום" />
              </div>
              <div className="form-group full">
                <label>תיאור העבודה</label>
                <textarea value={form.description||''} onChange={e=>set('description',e.target.value)} placeholder="תאר את העבודה הנדרשת..." rows={3}/>
              </div>
            </div>
          </div>

          {/* ── 4. שיבוץ מפעילים ── */}
          <div style={{...sectionStyle, background:'#f0fdf4', borderColor:'#bbf7d0'}}>
            <div style={{...sectionTitle, color:'#15803d'}}>👷 שיבוץ מפעילים</div>

            {operators.length > 0 && (
              <div style={{marginBottom:10}}>
                {operators.map((op,idx)=>(
                  <div key={idx} style={{background:'white',borderRadius:8,padding:'10px 12px',
                                         marginBottom:8,border:'1px solid #bbf7d0',display:'flex',
                                         flexDirection:'column',gap:8}}>

function OrdersPage() {
  const [orders, setOrders] = useState([]);
  const [equipment, setEquipment] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [orderStatusOptions, setOrderStatusOptions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [search, setSearch] = useState('');
  const [filterStatus, setFilterStatus] = useState('all');
  const [modal, setModal] = useState(null);
  const [delTarget, setDelTarget] = useState(null);
  const { toast, show } = useToast();

  useEffect(() => {
    supabase.from('lookup_lists').select('value').eq('list_name','order_status').order('sort_order')
      .then(({data}) => setOrderStatusOptions((data||[]).map(r=>r.value)));
  }, []);

  const load = useCallback(async () => {
    setLoading(true);
    const [ord, eq, emp] = await Promise.all([
      supabase.from('orders').select('*,order_operators(employee_name,work_date,start_time,end_time,work_hours)').order('start_date',{ascending:false}).order('mia_number'),
      supabase.from('equipment').select('id,name,equipment_number,dedicated_type,mia_number').order('name'),
      supabase.from('employees').select('id,full_name,role').eq('employee_status','active').order('full_name'),
    ]);
    setOrders(ord.data||[]);
    setEquipment(eq.data||[]);
    setEmployees(emp.data||[]);
    setLoading(false);
  }, []);

  useEffect(() => { load(); }, [load]);

  // Display: name + mia_number (not equipment_number which can be a long SAP number)
  const eqMap    = Object.fromEntries(equipment.map(e=>[e.id, `${e.name}${e.mia_number?' מי"ה ('+e.mia_number+')':''}`]));
  const eqMiaMap = Object.fromEntries(equipment.filter(e=>e.mia_number).map(e=>[String(e.mia_number), e]));
  const empMap   = Object.fromEntries(employees.map(e=>[e.id, e.full_name]));

  // Resolve equipment display for an order
  function eqLabel(o) {
    // 1. Try equipment_id → UUID lookup in eqMap
    if (o.equipment_id && eqMap[o.equipment_id]) return eqMap[o.equipment_id];
    // 2. Try equipment_id as mia_number (historical orders stored mia_number in equipment_id field)
    if (o.equipment_id && eqMiaMap[String(o.equipment_id)]) {
      const e = eqMiaMap[String(o.equipment_id)];
      return `${e.name} מי"ה (${o.equipment_id})`;
    }
    // 3. Try mia_number field
    if (o.mia_number && eqMiaMap[String(o.mia_number)]) {
      const e = eqMiaMap[String(o.mia_number)];
      return `${e.name} מי"ה (${o.mia_number})`;
    }
    if (o.mia_number) return `מי"ה ${o.mia_number}`;
    if (o.is_external_equipment) return [o.equipment_type, o.equipment_size].filter(Boolean).join(' / ') || 'חיצוני';
    return '—';
  }

  const filtered = orders.filter(o => {
    const q = search.toLowerCase();
    const matchSearch = !q || o.project_name?.toLowerCase().includes(q) || o.client_name?.toLowerCase().includes(q) || o.order_number?.toLowerCase().includes(q);
    const matchStatus = filterStatus==='all' || o.status===filterStatus;
    return matchSearch && matchStatus;
  });

  async function handleDelete() {
    const { error } = await supabase.from('orders').delete().eq('id',delTarget.id);
    if (error) show('שגיאה במחיקה','error');
    else { show('ההזמנה נמחקה'); setOrders(p=>p.filter(o=>o.id!==delTarget.id)); }
    setDelTarget(null);
  }

  function handleSaved(saved) {
    setOrders(prev=>{
      const idx=prev.findIndex(o=>o.id===saved.id);
      if(idx>=0){const n=[...prev];n[idx]=saved;return n;}
      return [saved,...prev];
    });
    setModal(null);
    load(); // reload to get operators
    show(modal?.id?'ההזמנה עודכנה':'ההזמנה נוספה');
  }

  // Duplicate order: copy to next day, no operators
  async function duplicateOrder(o) {
    const nextDate = d => {
      if (!d) return '';
      const dt = new Date(d); dt.setDate(dt.getDate()+1);
      return dt.toISOString().slice(0,10);
    };
    // Generate next order number
    const year = new Date().getFullYear();
    const { data: existing } = await supabase.from('orders').select('order_number_display').like('order_number_display',`${year}-%`);
    const nums = (existing||[]).map(r=>parseInt((r.order_number_display||'').split('-')[1]||0)).filter(n=>!isNaN(n));
    const next = nums.length ? Math.max(...nums)+1 : 1;
    const newNum = `${year}-${String(next).padStart(3,'0')}`;

    const { id, created_at, order_operators, ...rest } = o;
    const newOrder = { ...rest, order_number_display: newNum,
      start_date: nextDate(o.start_date), end_date: nextDate(o.end_date),
      status: 'pending' };
    const { data, error } = await supabase.from('orders').insert([newOrder]).select().single();
    if (error) { show('שגיאה בשכפול: '+error.message,'error'); return; }
    setOrders(prev=>[data,...prev]);
    show(`ההזמנה שוכפלה → ${newNum}`);
  }

  return (
    <div>
      <Toast toast={toast}/>
      {modal && <OrderModal item={modal==='add'?null:modal} equipment={equipment} employees={employees} onClose={()=>setModal(null)} onSave={handleSaved}/>}
      {delTarget && <ConfirmDialog msg={`למחוק את הזמנה "${delTarget.project_name}"?`} onYes={handleDelete} onNo={()=>setDelTarget(null)}/>}

      <div className="page-header">
        <div><h2>הזמנות</h2><p>ניהול הזמנות עבודה והשיבוצים</p></div>
        <button className="btn btn-primary" onClick={()=>setModal('add')}>+ הזמנה חדשה</button>
      </div>

      <div className="search-box">
        <input className="search-input" placeholder="🔍 חיפוש לפי פרויקט, לקוח, מספר הזמנה..." value={search} onChange={e=>setSearch(e.target.value)}/>
      </div>
      <div className="filter-bar">
        <button className={`filter-btn${filterStatus==='all'?' active':''}`} onClick={()=>setFilterStatus('all')}>הכל</button>
        {orderStatusOptions.map(v=>(
          <button key={v} className={`filter-btn${filterStatus===v?' active':''}`} onClick={()=>setFilterStatus(v)}>{v}</button>
        ))}
      </div>

      {loading ? <div className="loading"><div className="spinner"></div> טוען...</div> : (
        <div className="table-card">
          <div className="table-header"><h3>הזמנות ({filtered.length})</h3></div>
          {filtered.length===0 ? (
            <div className="empty-state">
              <div className="empty-icon">📋</div>
              <h3>{search||filterStatus!=='all'?'לא נמצאו תוצאות':'אין הזמנות עדיין'}</h3>
              {!search&&filterStatus==='all'&&<p>לחץ על "הזמנה חדשה" כדי להתחיל</p>}
            </div>
          ) : (
            <div className="table-scroll">
            <table>
              <thead><tr>
                <th>פק"ע</th><th>כלי</th><th>מזמין</th><th>מפעילים</th>
                <th>התחלה</th><th>סיום</th><th>מיקום</th><th>סטטוס</th><th>פעולות</th>
              </tr></thead>
              <tbody>
                {filtered.map((o,i)=>(
                  <tr key={o.id}>
                    <td><strong style={{color:'var(--primary)'}}>{o.order_number_display||'—'}</strong></td>
                    <td style={{fontSize:12}}>{eqLabel(o)}</td>
                    <td>{fmt(o.client_name)}</td>
                    <td style={{fontSize:12}}>
                      {(() => {
                        // Filter operators for this order's date
                        const dayOps = (o.order_operators||[]).filter(op => !op.work_date || op.work_date === o.start_date);
                        const names = [...new Set(dayOps.map(op=>op.employee_name))];
                        return names.length > 0
                          ? names.join(', ')
                          : <span style={{color:'var(--text-muted)'}}>לא שובץ</span>;
                      })()}
                    </td>
                    <td>{fmtDate(o.start_date)}</td>
                    <td>{fmtDate(o.end_date)}</td>
                    <td style={{fontSize:12,maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{fmt(o.location)}</td>
                    <td><Badge val={o.status} type="order"/></td>
                    <td style={{whiteSpace:'nowrap'}}>
                      <button className="action-btn" onClick={()=>setModal(o)} title="עריכה">✏️</button>
                      <button className="action-btn" onClick={()=>duplicateOrder(o)} title="שכפל ליום הבא">📋</button>
                      <button className="action-btn del" onClick={()=>setDelTarget(o)} title="מחיקה">🗑️</button>
                    </td>
                  </tr>
                ))}
              </tbody>
            </table>
            </div>
          )}
        </div>
      )}
    </div>
  );
}

function TaskModal({ item, equipment, employees, onClose, onSave }) {
  const blank = {
    title:'', description:'', status:'open', priority:'medium',
    assigned_to:'', equipment_id:'', due_date:'', notes:'',
  };
  const [form, setForm] = useState(item ? {...blank,...item} : blank);
  const [saving, setSaving] = useState(false);
  const set = (k,v) => setForm(f=>({...f,[k]:v}));

  async function handleSave() {
    if (!form.title.trim()) { alert('כותרת המשימה היא שדה חובה'); return; }
    setSaving(true);
    const data = {...form};
    ['assigned_to','equipment_id'].forEach(k => { if(!data[k]) data[k]=null; });
    if(data.id){delete data.id;delete data.created_at;}
    let res;
    if(item?.id) res = await supabase.from('tasks').update(data).eq('id',item.id).select();
    else res = await supabase.from('tasks').insert([data]).select();
    setSaving(false);
    if(res.error){alert('שגיאה: '+res.error.message);return;}
    onSave(res.data[0]);
  }

  return (
    <div className="modal-overlay">
      <div className="modal">
        <div className="modal-header">
          <h3>{item?'עריכת משימה':'משימה חדשה'}</h3>
          <button className="close-btn" onClick={onClose}>✕</button>
        </div>
        <div className="modal-body">
          <div className="form-grid">
            <div className="form-group full">
              <label>כותרת *</label>
              <input value={form.title} onChange={e=>set('title',e.target.value)} />
            </div>
            <div className="form-group">
              <label>סטטוס</label>
              <select value={form.status} onChange={e=>set('status',e.target.value)}>
                <option value="open">פתוח</option>
                <option value="in_progress">בביצוע</option>
                <option value="done">הושלם</option>
                <option value="cancelled">בוטל</option>
              </select>
            </div>
            <div className="form-group">
              <label>עדיפות</label>
              <select value={form.priority} onChange={e=>set('priority',e.target.value)}>
                <option value="low">נמוכה</option>
                <option value="medium">בינונית</option>
                <option value="high">גבוהה</option>
              </select>
            </div>
            <div className="form-group">
              <label>הוקצה ל</label>
              <select value={form.assigned_to||''} onChange={e=>set('assigned_to',e.target.value)}>
                <option value="">— בחר —</option>
                {employees.map(e=><option key={e.id} value={e.id}>{e.full_name}</option>)}

            </div>
            <div className="form-group">
              <label>כלי קשור</label>

                <option value="">— בחר —</option>

            </div>
            <div className="form-group">
              <label>תאריך יעד</label>
              <input type="date" value={form.due_date||''} onChange={e=>set('due_date',e.target.value)} />
            </div>
            <div className="form-group full">
              <label>תיאור</label>
              <textarea value={form.description} onChange={e=>set('description',e.target.value)} />
            </div>
            <div className="form-group full">
              <label>הערות</label>

        </div>
        <div className="modal-footer">

        </div>

    </div>
  );
}

// Helper: is a date string a Friday or Saturday?
function isWeekend(dateStr) {
  // Parse date parts directly to avoid UTC timezone offset issues
  const [y, m, d] = dateStr.split('-').map(Number);
  const day = new Date(y, m - 1, d).getDay(); // 0=Sun,5=Fri,6=Sat
  return day === 5 || day === 6;
}

// Format date for display in Hebrew
function formatDateHe(dateStr) {
  const days = ['ראשון','שני','שלישי','רביעי','חמישי','שישי','שבת'];
  const [y, m, d] = dateStr.split('-').map(Number);
  const dt = new Date(y, m - 1, d);
  return `יום ${days[dt.getDay()]}, ${d.toString().padStart(2,'0')}/${m.toString().padStart(2,'0')}/${y}`;
}
