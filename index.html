// REPORTS PAGE
// ══════════════════════════════════════════════════════════════════════════════
function ReportsPage() {
  const { toast, show } = useToast();

  // Default date range: first of current month → today
  function localToday() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  }
  function localFirstOfMonth() {
    const d = new Date();
    return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-01`;
  }

  const [fromDate, setFromDate] = useState(localFirstOfMonth());
  const [toDate,   setToDate]   = useState(localToday());
  const [activeTab, setActiveTab] = useState('general');
  const [orders, setOrders] = useState([]);
  const [eqByUuidR, setEqByUuidR] = useState({}); // UUID -> equipment row (for reports)
  const [loading, setLoading] = useState(false);
  const [loaded, setLoaded] = useState(false);

  const TABS = [
    { id:'general',    label:'דוח כללי',         icon:'📄' },
    { id:'equip_avail',label:'זמינות כלים',        icon:'🚧' },
    { id:'equip_sched',label:'שיבוץ כלים',         icon:'📅' },
    { id:'ops_sched',  label:'שיבוץ מפעילים',      icon:'👷' },
    { id:'util_pct',   label:'% ניצול כלים',       icon:'📊' },
    { id:'locations',  label:'מסריצת מיקומים',     icon:'📍' },
  ];

  // Status badge colors
  const statusColors = {
    'ממתין':  { bg:'#fef9c3', text:'#854d0e' },
    'מאושר':  { bg:'#dcfce7', text:'#15803d' },
    'בביצוע': { bg:'#dbeafe', text:'#1d4ed8' },
    'הושלם':  { bg:'#f3f4f6', text:'#374151' },
    'בוטל':   { bg:'#fee2e2', text:'#b91c1c' },
    'נדחה':   { bg:'#fce7f3', text:'#9d174d' },
  };
  function statusBadge(s) { return statusColors[s] || {bg:'#f3f4f6',text:'#374151'}; }

  // Format date for display
  function dispDate(d) { return d ? d.replace(/-/g,'/') : '—'; }

  // Load all data for selected date range
  async function load() {
    if (!fromDate || !toDate) { show('בחר תאריכים','error'); return; }
    setLoading(true);
    setOpLoading(true);
    const [ordRes, opsRes, eqRes] = await Promise.all([
      supabase
        .from('orders')
        .select('id,order_number_display,client_name,equipment_id,mia_number,equipment_name,is_external_equipment,equipment_type,equipment_size,supplier_name,start_date,end_date,start_time,end_time,status,location,description,order_operators(employee_name,start_time,end_time,work_hours)')
        .lte('start_date', toDate)
        .gte('end_date', fromDate)
        .order('start_date'),
      supabase
        .from('order_operators')
        .select('id,order_id,employee_name,work_date,start_time,end_time,work_hours,orders(order_number_display,order_line,mia_number,client_name,location)')
        .gte('work_date', fromDate)
        .lte('work_date', toDate)
        .order('work_date')
        .order('order_id'),
      supabase
        .from('equipment')
        .select('id,mia_number,name,dedicated_type,bonus_percentage')
        .not('mia_number','is',null),
    ]);
    if (ordRes.error) show('שגיאה בטעינת הזמנות','error');
    else { setOrders(ordRes.data||[]); setLoaded(true); }
    if (opsRes.error) show('שגיאה בטעינת שיבוץ','error');
    else {
      const map = {};
      const mapUuid = {};
      (eqRes.data||[]).forEach(e => {
        if (e.mia_number) map[String(e.mia_number)] = e;
        if (e.id) mapUuid[e.id] = e;
      });
      setEqByMia(map);
      setEqByUuidR(mapUuid);
      setOpRows(opsRes.data||[]);
      setOpLoaded(true);
    }
    setLoading(false);
    setOpLoading(false);
  }

  // Export to CSV
  function exportCSV(rows, cols, filename) {
    const header = cols.map(c=>c.label).join(',');
    const lines = rows.map(r => cols.map(c => {
      const v = String(c.value(r)||'').replace(/"/g,'""');
      return `"${v}"`;
    }).join(','));
    const csv = '﻿' + [header,...lines].join('\n'); // BOM for Hebrew Excel
    const blob = new Blob([csv], {type:'text/csv;charset=utf-8'});
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = filename;
    a.click();
  }

  // ── TAB: GENERAL ──────────────────────────────────────────────────────────
  function GeneralTab() {
    const [openOrder, setOpenOrder] = React.useState(null);

    // eqByUuidR: UUID->equipment (state from parent), eqByMia: mia->equipment
    function eqLabelG(o) {
      // 1. equipment_id is a real UUID — use eqByUuidR
      if (o.equipment_id && eqByUuidR[o.equipment_id]) {
        const e = eqByUuidR[o.equipment_id];
        return `${e.name}${e.mia_number ? ' מי"ה ('+e.mia_number+')' : ''}`;
      }
      // 2. equipment_id is actually a mia_number (historical import)
      if (o.equipment_id && eqByMia[String(o.equipment_id)]) {
        const e = eqByMia[String(o.equipment_id)];
        return `${e.name} מי"ה (${o.equipment_id})`;
      }
      // 3. mia_number field
      if (o.mia_number && eqByMia[String(o.mia_number)]) {
        const e = eqByMia[String(o.mia_number)];
        return `${e.name} מי"ה (${o.mia_number})`;
      }
      if (o.mia_number) return `מי"ה ${o.mia_number}`;
      if (o.is_external_equipment)
        return [o.supplier_name, o.equipment_size].filter(Boolean).join(' - ') || o.equipment_type || 'חיצוני';
      return '—';
    }

    // Sum work_hours from operators for each order
    function totalHours(o) {
      const ops = o.order_operators||[];
      if (!ops.length) return '—';
      const sum = ops.reduce((acc, op) => acc + (parseFloat(op.work_hours)||0), 0);
      return sum > 0 ? sum.toFixed(1) : '—';
    }

    const STATUS_HE_G = { pending:'ממתין', approved:'אושר', active:'בביצוע', completed:'הושלם', cancelled:'בוטל' };

    // Format time HH:MM from "HH:MM:SS" or "HH:MM"
    const fmtTime = t => t ? t.slice(0,5) : '—';

    const cols = [
      { label:'פק"ע',          value: o => o.order_number_display||'' },
      { label:'כלי',           value: o => eqLabelG(o) },
      { label:'מזמין',         value: o => o.client_name||'' },
      { label:'מפעילים',       value: o => [...new Set((o.order_operators||[]).map(x=>x.employee_name))].join(', ') },
      { label:'שעות',          value: o => totalHours(o) },
      { label:'שעת התחלה',     value: o => fmtTime(o.start_time) },
      { label:'שעת סיום',      value: o => fmtTime(o.end_time) },
      { label:'מיקום',         value: o => o.location||'' },
      { label:'תאריך',         value: o => dispDate(o.start_date) },
      { label:'סטטוס',         value: o => STATUS_HE_G[o.status]||o.status||'' },
    ];

    const total = orders.length;

    return (
      <div>
        {openOrder && <OrderModal item={openOrder} onClose={()=>setOpenOrder(null)} onSave={()=>{setOpenOrder(null);load();}} equipment={Object.values(eqByUuidR)} employees={[]} />}

        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <span style={{fontWeight:700,fontSize:15}}>📄 דוח כללי הזמנות ({total})</span>
          <button className="btn btn-outline btn-sm"
            onClick={()=>exportCSV(orders, cols, `דוח_כללי_${fromDate}_${toDate}.csv`)}>
            ⬆ ייצא CSV
          </button>
        </div>

        {total === 0 ? (
          <div style={{textAlign:'center',color:'#a8a29e',padding:'40px 0',fontSize:14}}>אין הזמנות בטווח שנבחר</div>
        ) : (
          <div style={{overflowX:'auto',maxHeight:'65vh',overflowY:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr style={{background:'#1c1917',color:'white',position:'sticky',top:0,zIndex:1}}>
                  {['פק"ע','כלי','מזמין','מפעילים','שעות','שעת התחלה','שעת סיום','מיקום','תאריך','סטטוס',''].map(h=>(
                    <th key={h} style={{padding:'10px 10px',textAlign:'right',fontWeight:600,whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {orders.map((o,i) => {
                  const equipLabel = eqLabelG(o);
                  const ops = [...new Set((o.order_operators||[]).map(x=>x.employee_name))].join(', ');
                  const hrs = totalHours(o);
                  const statusHe = STATUS_HE_G[o.status]||o.status||'—';
                  const sc = statusBadge(o.status);
                  return (
                    <tr key={o.id} style={{background:i%2===0?'white':'#fafaf9',borderBottom:'1px solid #e7e5e4'}}>
                      <td style={{padding:'9px 10px',color:'var(--primary)',fontWeight:700,whiteSpace:'nowrap'}}>{o.order_number_display||'—'}</td>
                      <td style={{padding:'9px 10px',fontSize:12,maxWidth:180,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{equipLabel}</td>
                      <td style={{padding:'9px 10px',whiteSpace:'nowrap'}}>{o.client_name||'—'}</td>
                      <td style={{padding:'9px 10px',fontSize:12,maxWidth:160,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{ops||'—'}</td>
                      <td style={{padding:'9px 10px',color:'#15803d',fontWeight:600,textAlign:'center'}}>{hrs}</td>
                      <td style={{padding:'9px 10px',textAlign:'center',whiteSpace:'nowrap'}}>{fmtTime(o.start_time)}</td>
                      <td style={{padding:'9px 10px',textAlign:'center',whiteSpace:'nowrap'}}>{fmtTime(o.end_time)}</td>
                      <td style={{padding:'9px 10px',maxWidth:120,overflow:'hidden',textOverflow:'ellipsis',whiteSpace:'nowrap'}}>{o.location||'—'}</td>
                      <td style={{padding:'9px 10px',whiteSpace:'nowrap'}}>{dispDate(o.start_date)}</td>
                      <td style={{padding:'9px 10px'}}>
                        <span style={{background:sc.bg,color:sc.text,padding:'2px 8px',borderRadius:4,fontSize:11,fontWeight:600,whiteSpace:'nowrap'}}>{statusHe}</span>
                      </td>
                      <td style={{padding:'9px 6px',textAlign:'center'}}>
                        <button className="btn btn-outline btn-sm"
                          style={{padding:'3px 8px',fontSize:11,whiteSpace:'nowrap'}}
                          onClick={()=>setOpenOrder(o)}>
                          📋 פתח
                        </button>
                      </td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
  }

  // ── TAB: OPERATOR SCHEDULE ────────────────────────────────────────────────
  const [opRows, setOpRows]       = useState([]);
  const [eqByMia, setEqByMia]     = useState({}); // mia_number -> equipment row
  const [opLoading, setOpLoading] = useState(false);
  const [opLoaded, setOpLoaded]   = useState(false);
  const [filterMia, setFilterMia] = useState('');
  const [filterOp, setFilterOp]   = useState('');

  async function loadOps() {
    if (!fromDate || !toDate) { show('בחר תאריכים','error'); return; }
    setOpLoading(true);
    const [opsRes, eqRes] = await Promise.all([
      supabase
        .from('order_operators')
        .select('id,order_id,employee_name,work_date,start_time,end_time,work_hours,orders(order_number_display,order_line,mia_number,client_name,location)')
        .gte('work_date', fromDate)
        .lte('work_date', toDate)
        .order('work_date')
        .order('order_id'),
      supabase
        .from('equipment')
        .select('id,mia_number,name,dedicated_type,bonus_percentage')
        .not('mia_number','is',null),
    ]);
    if (opsRes.error) { show('שגיאה בטעינה: '+opsRes.error.message,'error'); setOpLoading(false); return; }
    // Build mia_number -> equipment map
    const map = {};
    (eqRes.data||[]).forEach(e => { if(e.mia_number) map[String(e.mia_number)] = e; });
    setEqByMia(map);
    setOpRows(opsRes.data||[]);
    setOpLoaded(true);
    setOpLoading(false);
  }

  // Calculate hours with overnight support
  function calcHours(start, end) {
    if (!start || !end) return null;
    const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
    let diff = toMin(end) - toMin(start);
    if (diff < 0) diff += 1440; // overnight shift
    return (diff/60).toFixed(2);
  }

  function OpsSchedTab() {
    const q1 = filterMia.trim().toLowerCase();
    const q2 = filterOp.trim().toLowerCase();
    const filtered = opRows.filter(r => {
      const mia = (r.orders?.mia_number||'').toLowerCase();
      const op  = (r.employee_name||'').toLowerCase();
      return (!q1 || mia.includes(q1)) && (!q2 || op.includes(q2));
    });

    const cols = [
      { label:'תאריך',           value: r => r.work_date ? r.work_date.replace(/-/g,'/') : '' },
      { label:'פק"ע',            value: r => r.orders?.order_number_display||'' },
      { label:'מיקום',           value: r => r.orders?.location||'' },
      { label:'שעות',            value: r => { const h=calcHours(r.start_time,r.end_time); return h||''; } },
      { label:'שעת סיום',        value: r => r.end_time   ? r.end_time.slice(0,5)   : '' },
      { label:'שעת התחלה',       value: r => r.start_time ? r.start_time.slice(0,5) : '' },
      { label:'אחוזי פרמיה',     value: r => { const e=eqByMia[String(r.orders?.mia_number||'')]; return e?.bonus_percentage||''; } },
      { label:'סוג',             value: r => { const e=eqByMia[String(r.orders?.mia_number||'')]; return e?.dedicated_type||''; } },
      { label:'מי"ה',            value: r => r.orders?.mia_number||'' },
      { label:'כלי',             value: r => { const e=eqByMia[String(r.orders?.mia_number||'')]; return e?.name||''; } },
      { label:'מפעיל',           value: r => r.employee_name||'' },
    ];

    return (
      <div>
        {/* Header */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12,flexWrap:'wrap',gap:8}}>
          <span style={{fontWeight:700,fontSize:15}}>👷 דוח שיבוץ מפעילים ({filtered.length} רשומות)</span>
          <div style={{display:'flex',gap:8,flexWrap:'wrap',alignItems:'center'}}>
            <input placeholder="סינון מי&quot;ה..." value={filterMia} onChange={e=>setFilterMia(e.target.value)}
              style={{border:'1px solid var(--border)',borderRadius:8,padding:'5px 10px',fontSize:13,width:120}} />
            <input placeholder="סינון מפעיל..." value={filterOp} onChange={e=>setFilterOp(e.target.value)}
              style={{border:'1px solid var(--border)',borderRadius:8,padding:'5px 10px',fontSize:13,width:140}} />
            {opLoaded && (
              <button className="btn btn-outline btn-sm" onClick={()=>exportCSV(filtered,cols,`שיבוץ_מפעילים_${fromDate}_${toDate}.csv`)}>
                ⬇ ייצא CSV
              </button>
            )}
          </div>
        </div>

        {!opLoaded ? (
          <div style={{textAlign:'center',color:'#a8a29e',padding:'40px 0',fontSize:14}}>לחץ "טען" לטעינת הנתונים</div>
        ) : filtered.length === 0 ? (
          <div style={{textAlign:'center',color:'#a8a29e',padding:'40px 0',fontSize:14}}>אין רשומות בטווח שנבחר</div>
        ) : (
          <div style={{overflowX:'auto'}}>
            <table style={{width:'100%',borderCollapse:'collapse',fontSize:13}}>
              <thead>
                <tr style={{background:'#1c1917',color:'white'}}>
                  {['תאריך','פק"ע','מיקום','שעות','שעת סיום','שעת התחלה','אחוזי פרמיה','סוג','מי"ה','כלי','מפעיל'].map(h=>(
                    <th key={h} style={{padding:'10px 10px',textAlign:'right',fontWeight:600,whiteSpace:'nowrap'}}>{h}</th>
                  ))}
                </tr>
              </thead>
              <tbody>
                {filtered.map((r,i) => {
                  const hrs = calcHours(r.start_time, r.end_time);
                  const overnight = r.start_time && r.end_time && r.end_time.slice(0,5) < r.start_time.slice(0,5);
                  const eq = eqByMia[String(r.orders?.mia_number||'')] || {};
                  return (
                    <tr key={r.id} style={{background:i%2===0?'white':'#fafaf9',borderBottom:'1px solid #e7e5e4'}}>
                      <td style={{padding:'8px 10px',whiteSpace:'nowrap',fontWeight:600}}>{r.work_date?r.work_date.replace(/-/g,'/'):'—'}</td>
                      <td style={{padding:'8px 10px',color:'var(--primary)',fontWeight:700}}>{r.orders?.order_number_display||'—'}</td>
                      <td style={{padding:'8px 10px',fontSize:12}}>{r.orders?.location||'—'}</td>
                      <td style={{padding:'8px 10px',color:'#15803d',fontWeight:700}}>{hrs||'—'}</td>
                      <td style={{padding:'8px 10px',whiteSpace:'nowrap'}}>
                        {r.end_time?r.end_time.slice(0,5):'—'}
                        {overnight && <span title="משמרת לילה" style={{marginRight:4,fontSize:11}}>🌙</span>}
                      </td>
                      <td style={{padding:'8px 10px',whiteSpace:'nowrap'}}>{r.start_time?r.start_time.slice(0,5):'—'}</td>
                      <td style={{padding:'8px 10px',textAlign:'center'}}>{eq.bonus_percentage||'—'}</td>
                      <td style={{padding:'8px 10px',fontSize:12,color:'#0369a1'}}>{eq.dedicated_type||'—'}</td>
                      <td style={{padding:'8px 10px',fontWeight:600}}>{r.orders?.mia_number||'—'}</td>
                      <td style={{padding:'8px 10px',fontSize:12}}>{eq.name||'—'}</td>
                      <td style={{padding:'8px 10px'}}>{r.employee_name||'—'}</td>
                    </tr>
                  );
                })}
              </tbody>
            </table>
          </div>
        )}
      </div>
    );
  }

  // ── PLACEHOLDER for future tabs ────────────────────────────────────────────
  function ComingSoon({ label }) {
    return (
      <div style={{textAlign:'center',padding:'60px 0',color:'#a8a29e'}}>
        <div style={{fontSize:40,marginBottom:12}}>🔧</div>
        <div style={{fontSize:15,fontWeight:600,color:'#78716c'}}>{label}</div>
        <div style={{fontSize:13,marginTop:6}}>בקרוב...</div>
      </div>
    );
  }

  const tabContent = {
    general:     <GeneralTab />,
    equip_avail: <ComingSoon label="זמינות כלים" />,
    equip_sched: <ComingSoon label="שיבוץ כלים" />,
    ops_sched:   <OpsSchedTab />,
    util_pct:    <ComingSoon label="% ניצול כלים" />,
    locations:   <ComingSoon label="מסריצת מיקומים" />,
  };

  return (
    <div>
      {toast}
      <div className="page-header">
        <div>
          <h2>📊 דוחות</h2>
          <p style={{color:'var(--text-muted)',fontSize:13}}>בחר טווח תאריכים וייצא את הדוח הרצוי</p>
        </div>
      </div>

      {/* Date range picker */}
      <div style={{background:'white',borderRadius:14,border:'1px solid var(--border)',padding:'16px 20px',marginBottom:16,display:'flex',alignItems:'center',gap:16,flexWrap:'wrap'}}>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <label style={{fontSize:13,fontWeight:600,whiteSpace:'nowrap'}}>מתאריך</label>
          <input type="date" value={fromDate} onChange={e=>setFromDate(e.target.value)}
            style={{border:'1px solid var(--border)',borderRadius:8,padding:'6px 10px',fontSize:13}} />
        </div>
        <div style={{display:'flex',alignItems:'center',gap:8}}>
          <label style={{fontSize:13,fontWeight:600,whiteSpace:'nowrap'}}>עד תאריך</label>
          <input type="date" value={toDate} onChange={e=>setToDate(e.target.value)}
            style={{border:'1px solid var(--border)',borderRadius:8,padding:'6px 10px',fontSize:13}} />
        </div>
        <button className="btn btn-primary" onClick={load} disabled={loading}
          style={{display:'flex',alignItems:'center',gap:6}}>
          {loading ? '⏳ טוען...' : '🔄 רענן'}
        </button>
        {loaded && (
          <span style={{fontSize:13,color:'#15803d',fontWeight:600}}>✓ {orders.length} הזמנות בטווח</span>
        )}
      </div>

      {/* Tabs */}
      <div style={{background:'white',borderRadius:14,border:'1px solid var(--border)',overflow:'hidden'}}>
        {/* Tab bar */}
        <div style={{display:'flex',borderBottom:'1px solid var(--border)',overflowX:'auto'}}>
          {TABS.map(t => (
            <button key={t.id} onClick={()=>setActiveTab(t.id)} style={{
              display:'flex',alignItems:'center',gap:6,
              padding:'12px 16px',border:'none',cursor:'pointer',
              background: activeTab===t.id ? 'white' : '#fafaf9',
              color: activeTab===t.id ? 'var(--primary)' : '#78716c',
              fontWeight: activeTab===t.id ? 700 : 400,
              fontSize:13,whiteSpace:'nowrap',
              borderBottom: activeTab===t.id ? '2px solid var(--primary)' : '2px solid transparent',
              transition:'all 0.15s',
            }}>
              <span>{t.icon}</span>{t.label}
            </button>
          ))}
        </div>

        {/* Tab content */}
        <div style={{padding:20}}>
          {!loaded ? (
            <div style={{textAlign:'center',color:'#a8a29e',padding:'40px 0',fontSize:14}}>
              בחר טווח תאריכים ולחץ רענן להצגת נתונים
            </div>
          ) : tabContent[activeTab]}
        </div>
      </div>
    </div>
  );
}

function SettingsPage() {
  const { toast, show } = useToast();

  // Each list is {name, label, rows}
  const LIST_DEFS = [
    { name: 'license_types',            label: 'סוגי רישיון מפעיל' },
    { name: 'equipment_types',          label: 'סוגי כלי צמ"ה' },
    { name: 'equipment_status_options', label: 'סטטוס כלי (זמינות)' },
    { name: 'attendance_status',        label: 'סטטוס נוכחות עובד (זמינות)' },
    { name: 'order_status',             label: 'סטטוס הזמנה' },
  ];

  const [rows, setRows] = useState({});        // { list_name: [{id, value, sort_order}] }
  const [loading, setLoading] = useState(true);
  const [newVal, setNewVal] = useState({});    // { list_name: '' }

  // Load all lookup rows
  const loadAll = useCallback(async () => {
    setLoading(true);
    const { data, error } = await supabase.from('lookup_lists').select('*').order('list_name').order('sort_order');
    if (!error) {
      const grouped = {};
      LIST_DEFS.forEach(d => { grouped[d.name] = []; });
      (data||[]).forEach(r => {
        if (grouped[r.list_name]) grouped[r.list_name].push(r);
      });
      setRows(grouped);
    }
    setLoading(false);
  }, []);

  useEffect(() => { loadAll(); }, [loadAll]);

  // Add a new value to a list
  async function handleAdd(listName) {
    const val = (newVal[listName]||'').trim();
    if (!val) return;
    const maxOrder = (rows[listName]||[]).reduce((m,r)=>Math.max(m,r.sort_order||0),0);
    const { data, error } = await supabase.from('lookup_lists')
      .insert({ list_name: listName, value: val, sort_order: maxOrder+10 })
      .select().single();
    if (error) { console.error('lookup insert error:', error); show('שגיאה בהוספה: ' + error.message,'error'); return; }
    setRows(prev => ({ ...prev, [listName]: [...(prev[listName]||[]), data] }));
    setNewVal(prev => ({ ...prev, [listName]: '' }));
    show(`"${val}" נוסף`);
  }

  // Delete a value from a list
  async function handleDelete(listName, row) {
    const { error } = await supabase.from('lookup_lists').delete().eq('id', row.id);
    if (error) { show('שגיאה במחיקה','error'); return; }
    setRows(prev => ({ ...prev, [listName]: prev[listName].filter(r=>r.id!==row.id) }));
    show(`"${row.value}" נמחק`);
  }

  // ── Renumber all orders once ──────────────────────────────────────────────
  const [renumState, setRenumState] = useState('idle'); // idle | running | done | error

  async function renumberOrders() {
    if (!window.confirm('פעולה זו תמספר מחדש את כל ההזמנות לפי תאריך (2026-001, 2026-002...). להמשיך?')) return;
    setRenumState('running');

    // Fetch all orders sorted by date, then mia_number as tiebreaker
    const { data, error } = await supabase
      .from('orders')
      .select('id, start_date, mia_number')
      .order('start_date', { ascending: true })
      .order('mia_number', { ascending: true, nullsFirst: false });

    if (error) { show('שגיאה בשליפה: ' + error.message, 'error'); setRenumState('error'); return; }

    let fail = 0;
    // Update in batches of 50 to avoid timeout
    for (let i = 0; i < data.length; i++) {
      const num = `2026-${String(i + 1).padStart(3, '0')}`;
      const { error: upErr } = await supabase
        .from('orders')
        .update({ order_number_display: num })
        .eq('id', data[i].id);
      if (upErr) fail++;
    }

    if (fail === 0) {
      show(`✅ ${data.length} הזמנות מוספרו בהצלחה (2026-001 עד 2026-${String(data.length).padStart(3,'0')})`, 'success');
      setRenumState('done');
    } else {
      show(`⚠️ הושלם עם ${fail} שגיאות`, 'error');
      setRenumState('error');
    }
  }

  return (
    <div>
      <Toast toast={toast}/>
      <div className="page-header">
        <div><h2>הגדרות</h2><p>ניהול רשימות עזר ופרמטרים</p></div>
      </div>

      {/* ── One-time order renumbering ── */}
      <div className="table-card" style={{marginBottom:24,padding:20}}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',flexWrap:'wrap',gap:12}}>
          <div>
            <h3 style={{marginBottom:4}}>🔢 מספור הזמנות</h3>
            <p style={{fontSize:13,color:'var(--text-muted)'}}>
              ממספר מחדש את כל ההזמנות לפי תאריך: 2026-001 (ראשונה) עד 2026-NNN (אחרונה).<br/>
              הזמנות חדשות יקבלו אוטומטית את המספר הבא. יש להריץ פעם אחת בלבד.
            </p>
          </div>
          <button
            className="btn btn-primary"
            onClick={renumberOrders}
            disabled={renumState === 'running' || renumState === 'done'}
            style={{minWidth:160,whiteSpace:'nowrap'}}>
            {renumState === 'running' ? '⏳ מספר...' :
             renumState === 'done'    ? '✅ הושלם' :
             '🔢 מספר הזמנות מחדש'}
          </button>
        </div>
      </div>

      {loading && <p style={{color:'var(--text-muted)'}}>טוען...</p>}

      {LIST_DEFS.map(def => (
        <div key={def.name} className="table-card" style={{marginBottom:24}}>
          <div className="table-header">
            <h3>{def.label}</h3>
            <span style={{fontSize:12,color:'var(--text-muted)'}}>{(rows[def.name]||[]).length} ערכים</span>
          </div>
          <div style={{padding:'16px'}}>
            {/* Current values */}
            <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:16}}>
              {(rows[def.name]||[]).length === 0 && (
                <span style={{color:'var(--text-muted)',fontSize:13}}>אין ערכים עדיין</span>
              )}
              {(rows[def.name]||[]).map(r => (
                <div key={r.id} style={{
                  display:'inline-flex', alignItems:'center', gap:6,
                  background:'var(--primary-light)', borderRadius:20,
                  padding:'4px 12px', fontSize:14, fontWeight:500
                }}>
                  <span>{r.value}</span>
                  <button
                    onClick={()=>handleDelete(def.name,r)}
                    style={{background:'none',border:'none',cursor:'pointer',
                            color:'var(--danger)',fontSize:16,lineHeight:1,padding:0}}
                    title="מחק"
                  >×</button>
                </div>
              ))}
            </div>
            {/* Add new value */}
            <div style={{display:'flex',gap:8,alignItems:'center'}}>
              <input
                type="text"
                value={newVal[def.name]||''}
                onChange={e=>setNewVal(p=>({...p,[def.name]:e.target.value}))}
                onKeyDown={e=>e.key==='Enter'&&handleAdd(def.name)}
                placeholder="ערך חדש..."
                style={{flex:1,padding:'8px 12px',border:'1px solid var(--border)',
                        borderRadius:8,fontSize:14,fontFamily:'inherit',direction:'rtl'}}
              />
              <button className="btn btn-primary" onClick={()=>handleAdd(def.name)}>
                + הוסף
              </button>
            </div>
          </div>
        </div>
      ))}
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// SIDEBAR + ROUTER
// ══════════════════════════════════════════════════════════════════════════════
const PAGES = [
  { id:'home',        label:'דף הבית',    icon:'🏠' },
  { id:'equipment',   label:'כלים וציוד', icon:'🏗️' },
  { id:'employees',   label:'עובדים',     icon:'👷' },
  { id:'orders',      label:'הזמנות',     icon:'📋' },
  { id:'calendar',    label:'לוח שנה',    icon:'📆' },
  { id:'schedule',    label:'לוח שיבוץ',  icon:'👷' },
  { id:'tasks',       label:'משימות',     icon:'✅' },
  { id:'availability',label:'זמינות',     icon:'📅' },
  { id:'reports',     label:'דוחות',      icon:'📊' },
  { id:'settings',    label:'הגדרות',     icon:'⚙️' },
];

function App() {
  const [page, setPage] = useState('home');

  const content = {
    home:         <HomePage navigate={setPage} />,

    employees:    <EmployeesPage />,
    orders:       <OrdersPage />,
    calendar:     <CalendarPage />,
    schedule:     <SchedulePage />,
    tasks:        <TasksPage />,
    availability: <AvailabilityPage />,

  return (
    <>
      {/* Sidebar */}
      <nav id="sidebar">
        <div className="sidebar-logo">
          <div className="logo-icon">🏗️</div>
          <div className="logo-text">
            <h1>ניהול צי</h1>
            <p>מנופים וצמ"ה</p>
          </div>
        </div>
        <ul className="nav-list">
          {PAGES.map(p => (

}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
