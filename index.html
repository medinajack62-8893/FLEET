];

const ATTENDANCE_OPTIONS = [
  {value:'present',       label:'נוכח',           color:'#16a34a', bg:'#dcfce7'},
  {value:'weekend',       label:'סופ"ש',           color:'#0369a1', bg:'#dbeafe'},
  {value:'vacation',      label:'חופשה',           color:'#d97706', bg:'#fef3c7'},
  {value:'sick',          label:'מחלה',            color:'#dc2626', bg:'#fee2e2'},
  {value:'reserve_duty',  label:'מילואים',         color:'#7c3aed', bg:'#ede9fe'},
  {value:'medical',       label:'בדיקות רפואיות',  color:'#0891b2', bg:'#cffafe'},
  {value:'training',      label:'הדרכה',           color:'#0284c7', bg:'#e0f2fe'},
  {value:'external_duty', label:'תפקיד חוץ',       color:'#059669', bg:'#d1fae5'},
  {value:'early_leave',   label:'עלייה מוקדמת',    color:'#ca8a04', bg:'#fef9c3'},
  {value:'other',         label:'אחר',             color:'#78716c', bg:'#f5f5f4'},
];

function AvailabilityPage() {
  const [equipment, setEquipment] = useState([]);
  const [employees, setEmployees] = useState([]);
  const [statusMap, setStatusMap] = useState({}); // key: "type:id" => {id, status, notes}
  const [eqStatusOptions, setEqStatusOptions] = useState([]);
  const [attendanceOptions, setAttendanceOptions] = useState([]);
  const [loading, setLoading] = useState(true);
  const [confirming, setConfirming] = useState(false);
  const [dayConfirmed, setDayConfirmed] = useState(false);
  const [selectedDate, setSelectedDate] = useState(new Date().toISOString().slice(0,10));
  const [openNotes, setOpenNotes] = useState(null); // "type:id" or null
  const [notesDraft, setNotesDraft] = useState('');
  const { toast, show } = useToast();

  // Load status options from lookup_lists
  useEffect(() => {
    supabase.from('lookup_lists').select('value,list_name').in('list_name',['equipment_status_options','attendance_status']).order('sort_order')
      .then(({data}) => {
        const d = data||[];
        setEqStatusOptions(d.filter(r=>r.list_name==='equipment_status_options').map(r=>r.value));
        setAttendanceOptions(d.filter(r=>r.list_name==='attendance_status').map(r=>r.value));
      });
  }, []);

  // Load data for selected date
  const load = useCallback(async () => {
    setLoading(true);
    const [eqRes, empRes, eqStatusRes, empStatusRes] = await Promise.all([
      supabase.from('equipment').select('id,name,equipment_number,dedicated_type,mia_number').eq('equipment_status','active').order('name'),
      supabase.from('employees').select('id,full_name,role,mia_number_new').eq('employee_status','active').order('full_name'),
      supabase.from('daily_status').select('*').eq('record_date', selectedDate),
      supabase.from('employee_daily_status').select('*').eq('record_date', selectedDate),
    ]);
    setEquipment(eqRes.data||[]);
    setEmployees(empRes.data||[]);

    // Build status map
    const map = {};

    // Equipment statuses (from daily_status)
    (eqStatusRes.data||[]).forEach(r => { map[`equipment:${r.entity_id}`] = r; });

    // Default for equipment: copy from previous day if no record today
    const equipWithoutRecord = (eqRes.data||[]).filter(eq => !map[`equipment:${eq.id}`]);
    if (equipWithoutRecord.length > 0) {
      const prev = new Date(selectedDate); prev.setDate(prev.getDate()-1);
      const prevDate = prev.toISOString().slice(0,10);
      const { data: prevData } = await supabase.from('daily_status').select('*')
        .eq('record_date', prevDate).eq('entity_type','equipment');
      (prevData||[]).forEach(r => {
        const key = `equipment:${r.entity_id}`;
        if (!map[key]) map[key] = { ...r, _default: true, id: null };
      });
    }

    // Employee statuses (from employee_daily_status)
    (empStatusRes.data||[]).forEach(r => { map[`employee:${r.employee_id}`] = r; });

    // Default for employees: weekend → סופ"ש, else → נוכח
    const weekend = isWeekend(selectedDate);
    (empRes.data||[]).forEach(emp => {
      const key = `employee:${emp.id}`;
      if (!map[key]) map[key] = { status: weekend ? 'weekend' : 'present', notes: '', _default: true };
    });

    setStatusMap(map);

    // Check if this day was confirmed
    const { data: confData } = await supabase.from('confirmed_days').select('record_date').eq('record_date', selectedDate).maybeSingle();
    setDayConfirmed(!!confData);

    setLoading(false);
  }, [selectedDate]);

  useEffect(() => { load(); }, [load]);

  // Confirm day: save all defaults to DB and mark day as confirmed
  async function confirmDay() {
    setConfirming(true);
    const weekend = isWeekend(selectedDate);

    // Build inserts for employees with no DB record
    const empInserts = employees
      .filter(emp => !statusMap[`employee:${emp.id}`] || statusMap[`employee:${emp.id}`]._default)
      .map(emp => {
        const existing = statusMap[`employee:${emp.id}`];
        return { record_date: selectedDate, employee_id: emp.id,
                 status: existing?.status || (weekend ? 'weekend' : 'present'),
                 notes: existing?.notes || '' };
      });

    // Build inserts for equipment with no DB record
    const eqInserts = equipment
      .filter(eq => !statusMap[`equipment:${eq.id}`] || statusMap[`equipment:${eq.id}`]._default)
      .map(eq => {
        const existing = statusMap[`equipment:${eq.id}`];
        return { record_date: selectedDate, entity_type: 'equipment', entity_id: eq.id,
                 status: existing?.status || '',
                 notes: existing?.notes || '' };
      });

    // Insert employees
    if (empInserts.length > 0) {
      const { error } = await supabase.from('employee_daily_status').upsert(empInserts, { onConflict: 'record_date,employee_id' });
      if (error) { show('שגיאה בשמירת עובדים: '+error.message, 'error'); setConfirming(false); return; }
    }

    // Insert equipment
    if (eqInserts.length > 0) {
      const { error } = await supabase.from('daily_status').upsert(eqInserts, { onConflict: 'record_date,entity_id' });
      if (error) { show('שגיאה בשמירת כלים: '+error.message, 'error'); setConfirming(false); return; }
    }

    // Mark day as confirmed
    const { error: confError } = await supabase.from('confirmed_days')
      .upsert({ record_date: selectedDate, confirmed_at: new Date().toISOString() }, { onConflict: 'record_date' });
    if (confError) { show('שגיאה באישור: '+confError.message, 'error'); setConfirming(false); return; }

    setDayConfirmed(true);
    setConfirming(false);
    show('היום אושר ✅ כל הרשומות נשמרו');
    load(); // reload to get real DB records
  }

  // Save equipment status
  async function saveEquipmentStatus(equipId, status, notes) {
    const key = `equipment:${equipId}`;
    const existing = statusMap[key];
    let res;
    if (!existing || existing._default) {
      res = await supabase.from('daily_status')
        .insert({ record_date: selectedDate, entity_type: 'equipment', entity_id: equipId, status, notes: notes||'' })
        .select().single();
    } else {
      res = await supabase.from('daily_status')
        .update({ status, notes: notes||'', updated_at: new Date().toISOString() })
        .eq('id', existing.id).select().single();
    }
    if (res.error) { show('שגיאה: '+res.error.message,'error'); return; }
    setStatusMap(prev => ({ ...prev, [key]: res.data }));
    show('עודכן ✓');
  }

  // Save employee status
  async function saveEmployeeStatus(empId, status, notes) {
    const key = `employee:${empId}`;
    const existing = statusMap[key];
    let res;
    if (!existing || existing._default) {
      res = await supabase.from('employee_daily_status')
        .insert({ record_date: selectedDate, employee_id: empId, status, notes: notes||'' })
        .select().single();
    } else {
      res = await supabase.from('employee_daily_status')
        .update({ status, notes: notes||'', updated_at: new Date().toISOString() })
        .eq('id', existing.id).select().single();
    }
    if (res.error) { show('שגיאה: '+res.error.message,'error'); return; }
    setStatusMap(prev => ({ ...prev, [key]: res.data }));
    show('עודכן ✓');
  }

  // Copy previous day's equipment statuses
  async function copyFromYesterday() {
    const prev = new Date(selectedDate); prev.setDate(prev.getDate()-1);
    const prevDate = prev.toISOString().slice(0,10);
    const { data, error } = await supabase.from('daily_status').select('*')
      .eq('record_date', prevDate).eq('entity_type','equipment');
    if (error || !data?.length) { show('אין נתוני ציוד ליום הקודם','error'); return; }
    const inserts = data.map(r => ({
      record_date: selectedDate, entity_type: 'equipment',
      entity_id: r.entity_id, status: r.status, notes: r.notes||''
    }));
    const { error: err2 } = await supabase.from('daily_status').upsert(inserts,
      { onConflict: 'record_date,entity_type,entity_id' });
    if (err2) { show('שגיאה בהעתקה','error'); return; }
    show('הועתק מיום קודם ✓');
    load();
  }

  // Status color helper — status values are English (present, weekend, vacation, etc.)
  function empStatusStyle(status) {
    const opt = ATTENDANCE_OPTIONS.find(o=>o.value===status);
    return opt ? {background:opt.bg, color:opt.color, border:`1px solid ${opt.color}33`}
               : {background:'#f5f5f4',color:'#78716c',border:'1px solid #e7e5e4'};
  }
  function eqStatusStyle(status) {
    const opt = EQUIPMENT_OPTIONS.find(o=>o.value===status);
    return opt ? {background:opt.bg, color:opt.color, border:`1px solid ${opt.color}33`}
               : {background:'#f5f5f4',color:'#78716c',border:'1px solid #e7e5e4'};
  }

  const ROLE_LABEL = {operator:'מפעיל',driver:'נהג',mechanic:'מכונאי',supervisor:'מפקח',manager:'מנהל',other:'אחר'};

  return (
    <div>
      <Toast toast={toast}/>

      {/* Header */}
      <div className="page-header">
        <div>
          <h2>נוכחות וזמינות</h2>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          {dayConfirmed ? (
            <span style={{background:'#dcfce7',color:'#16a34a',border:'1px solid #16a34a44',
                          borderRadius:20,padding:'6px 16px',fontSize:13,fontWeight:700}}>
              ✅ יום מאושר
            </span>
          ) : (
            <button className="btn btn-primary" onClick={confirmDay} disabled={confirming}
              style={{background:'#16a34a',borderColor:'#16a34a'}}>
              {confirming ? 'שומר...' : '✅ אשר יום'}
            </button>
          )}
          <button className="btn btn-outline"
            onClick={()=>{ const d=new Date(selectedDate); d.setDate(d.getDate()-1); setSelectedDate(d.toISOString().slice(0,10)); }}
            style={{fontSize:18,padding:'6px 14px'}}>›</button>
          <div style={{
            background: isWeekend(selectedDate) ? '#fef3c7' : 'var(--primary-light)',
            border: `2px solid ${isWeekend(selectedDate) ? '#d97706' : 'var(--primary)'}`,
            borderRadius:12, padding:'8px 20px', textAlign:'center', minWidth:200
          }}>
            <div style={{fontSize:20,fontWeight:700,color: isWeekend(selectedDate) ? '#d97706' : 'var(--primary-dark)'}}>
              {formatDateHe(selectedDate)}
            </div>
            {isWeekend(selectedDate) && <div style={{fontSize:12,color:'#d97706',fontWeight:600}}>🔶 סוף שבוע</div>}
          </div>
          <button className="btn btn-outline"
            onClick={()=>setSelectedDate(new Date().toISOString().slice(0,10))}
            style={{fontSize:13}}>היום</button>
          <button className="btn btn-outline"
            onClick={()=>{ const d=new Date(selectedDate); d.setDate(d.getDate()+1); setSelectedDate(d.toISOString().slice(0,10)); }}
            style={{fontSize:18,padding:'6px 14px'}}>‹</button>
          <input type="date" value={selectedDate} onChange={e=>setSelectedDate(e.target.value)}
            style={{border:'1px solid var(--border)',borderRadius:8,padding:'6px 10px',fontSize:13,cursor:'pointer'}}/>
        </div>
      </div>

      {loading ? <div className="loading"><div className="spinner"></div> טוען...</div> : (
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:20}}>

          {/* ── EQUIPMENT ── */}
          <div className="table-card">
            <div className="table-header" style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
              <h3>🏗️ זמינות כלים ({equipment.length})</h3>
              <button className="btn btn-outline btn-sm" onClick={copyFromYesterday} title="העתק סטטוס מיום קודם">
                העתק מאתמול
              </button>
            </div>
            <div style={{padding:'8px 0'}}>
              {equipment.map(eq => {
                const key = `equipment:${eq.id}`;
                const rec = statusMap[key];
                const status = rec?.status || '';
                const notes = rec?.notes || '';
                const isOpen = openNotes === key;
                return (
                  <div key={eq.id} style={{padding:'10px 16px',borderBottom:'1px solid var(--border)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      {/* Name + type */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:14}}>{eq.mia_number ? `${eq.mia_number} — ` : ''}{eq.name}</div>
                        <div style={{fontSize:11,color:'var(--text-muted)'}}>{eq.equipment_number}{eq.dedicated_type ? ' • '+eq.dedicated_type : ''}</div>
                      </div>
                      {/* Status dropdown */}
                      <select
                        value={status}
                        onChange={e=>saveEquipmentStatus(eq.id,e.target.value,notes)}
                        style={{...eqStatusStyle(status), borderRadius:20, padding:'4px 10px',
                                fontSize:13, fontFamily:'inherit', cursor:'pointer', fontWeight:600,
                                minWidth:90, textAlign:'center'}}>
                        {EQUIPMENT_OPTIONS.map(o=><option key={o.value} value={o.value}>{o.label}</option>)}
                      </select>
                      {/* Notes toggle */}
                      <button
                        onClick={()=>{ setOpenNotes(isOpen?null:key); setNotesDraft(notes); }}
                        style={{background:'none',border:'1px solid var(--border)',borderRadius:6,
                                padding:'4px 8px',cursor:'pointer',fontSize:12,color:notes?'var(--primary)':'var(--text-muted)'}}>
                        {notes ? '📝' : 'הערה'}
                      </button>
                    </div>
                    {/* Notes field */}
                    {isOpen && (
                      <div style={{marginTop:8,display:'flex',gap:6}}>
                        <input value={notesDraft} onChange={e=>setNotesDraft(e.target.value)}
                          placeholder="הערה..."
                          style={{flex:1,padding:'6px 10px',border:'1px solid var(--border)',borderRadius:6,
                                  fontSize:13,fontFamily:'inherit',direction:'rtl'}}/>
                        <button className="btn btn-primary btn-sm"
                          onClick={()=>{ saveEquipmentStatus(eq.id,status,notesDraft); setOpenNotes(null); }}>
                          שמור
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
              {equipment.length===0 && <p style={{padding:16,color:'var(--text-muted)',fontSize:13}}>אין כלים פעילים</p>}
            </div>
          </div>

          {/* ── EMPLOYEES ── */}
          <div className="table-card">
            <div className="table-header">
              <h3>👷 נוכחות עובדים ({employees.length})</h3>
              {isWeekend(selectedDate) && (
                <span style={{fontSize:12,color:'var(--primary)',fontWeight:600}}>סוף שבוע — ברירת מחדל: סופ"ש</span>
              )}
            </div>
            <div style={{padding:'8px 0'}}>
              {employees.map(emp => {
                const key = `employee:${emp.id}`;
                const rec = statusMap[key];
                const status = rec?.status || '';
                const notes = rec?.notes || '';
                const isOpen = openNotes === key;
                const statusOpt = ATTENDANCE_OPTIONS.find(o=>o.value===status);
                return (
                  <div key={emp.id} style={{padding:'10px 16px',borderBottom:'1px solid var(--border)'}}>
                    <div style={{display:'flex',alignItems:'center',gap:10}}>
                      {/* Avatar */}
                      <div style={{width:34,height:34,borderRadius:'50%',
                                   background:'linear-gradient(135deg,var(--primary),#d97706)',
                                   display:'flex',alignItems:'center',justifyContent:'center',
                                   color:'white',fontWeight:700,fontSize:14,flexShrink:0}}>
                        {emp.full_name?.[0]}
                      </div>
                      {/* Name + role */}
                      <div style={{flex:1,minWidth:0}}>
                        <div style={{fontWeight:600,fontSize:14}}>{emp.mia_number_new ? `${emp.mia_number_new} — ` : ''}{emp.full_name}</div>
                        <div style={{fontSize:11,color:'var(--text-muted)'}}>{ROLE_LABEL[emp.role]||emp.role||''}</div>
                      </div>
                      {/* Status dropdown */}
                      <select
                        value={status}
                        onChange={e=>saveEmployeeStatus(emp.id,e.target.value,notes)}
                        style={{...empStatusStyle(status), borderRadius:20, padding:'4px 10px',
                                fontSize:13, fontFamily:'inherit', cursor:'pointer', fontWeight:600,
                                minWidth:110, textAlign:'center'}}>
                        {ATTENDANCE_OPTIONS.map(o=>(
                          <option key={o.value} value={o.value}>{o.label}</option>
                        ))}
                      </select>
                      {/* Notes toggle */}
                      <button
                        onClick={()=>{ setOpenNotes(isOpen?null:key); setNotesDraft(notes); }}
                        style={{background:'none',border:'1px solid var(--border)',borderRadius:6,
                                padding:'4px 8px',cursor:'pointer',fontSize:12,color:notes?'var(--primary)':'var(--text-muted)'}}>
                        {notes ? '📝' : 'הערה'}
                      </button>
                    </div>
                    {/* Notes field */}
                    {isOpen && (
                      <div style={{marginTop:8,display:'flex',gap:6}}>
                        <input value={notesDraft} onChange={e=>setNotesDraft(e.target.value)}
                          placeholder="הערה..."
                          style={{flex:1,padding:'6px 10px',border:'1px solid var(--border)',borderRadius:6,
                                  fontSize:13,fontFamily:'inherit',direction:'rtl'}}/>
                        <button className="btn btn-primary btn-sm"
                          onClick={()=>{ saveEmployeeStatus(emp.id,status,notesDraft); setOpenNotes(null); }}>
                          שמור
                        </button>
                      </div>
                    )}
                  </div>
                );
              })}
              {employees.length===0 && <p style={{padding:16,color:'var(--text-muted)',fontSize:13}}>אין עובדים פעילים</p>}
            </div>
          </div>

        </div>
      )}
    </div>
  );
}

// CALENDAR PAGE — monthly/weekly view of orders + equipment availability
// ══════════════════════════════════════════════════════════════════════════════
function CalendarPage() {
  const { toast, show } = useToast();

  const today = new Date();
  const [viewDate, setViewDate] = useState(today); // which month/week we're viewing
  const [viewMode, setViewMode] = useState('month'); // 'month' | 'week'
  const [orders, setOrders] = useState([]);
  const [equipment, setEquipment] = useState([]);
  const [dailyStatus, setDailyStatus] = useState({}); // { [date]: [{entity_id, status}] }
  const [selectedDay, setSelectedDay] = useState(null); // date string 'YYYY-MM-DD'
  const [loading, setLoading] = useState(true);

  // Status colors for orders
  const statusColors = {
    'ממתין':  { bg:'#fef9c3', text:'#854d0e', border:'#fde047' },
    'מאושר':  { bg:'#dcfce7', text:'#15803d', border:'#86efac' },
    'בביצוע': { bg:'#dbeafe', text:'#1d4ed8', border:'#93c5fd' },
    'הושלם':  { bg:'#f3f4f6', text:'#374151', border:'#d1d5db' },
    'בוטל':   { bg:'#fee2e2', text:'#b91c1c', border:'#fca5a5' },
    'נדחה':   { bg:'#fce7f3', text:'#9d174d', border:'#f9a8d4' },
  };

  function statusStyle(status) {
    return statusColors[status] || { bg:'#f3f4f6', text:'#374151', border:'#d1d5db' };
  }

  // Determine date range to fetch (month view: full month; week view: the week)
  function getRange() {
    if (viewMode === 'month') {
      const start = new Date(viewDate.getFullYear(), viewDate.getMonth(), 1);
      const end   = new Date(viewDate.getFullYear(), viewDate.getMonth()+1, 0);
      return [fmtDate(start), fmtDate(end)];
    } else {
      const d = new Date(viewDate);
      // start of week (Sunday)
      const day = d.getDay(); // 0=Sun
      const sun = new Date(d); sun.setDate(d.getDate() - day);
      const sat = new Date(sun); sat.setDate(sun.getDate() + 6);
      return [fmtDate(sun), fmtDate(sat)];
    }
  }

  // Local date string — avoids UTC shift (Israel UTC+3 means toISOString gives yesterday)
  function fmtDate(d) {
    const y = d.getFullYear();
    const mo = String(d.getMonth()+1).padStart(2,'0');
    const dy = String(d.getDate()).padStart(2,'0');
    return `${y}-${mo}-${dy}`;
  }

  // Load orders and equipment status for visible range
  const load = useCallback(async () => {
    setLoading(true);
    const [start, end] = getRange();
    const [ord, eq, ds] = await Promise.all([
      // orders that overlap the range
      supabase.from('orders')
        .select('id,order_number_display,client_name,equipment_id,equipment_name,mia_number,is_external_equipment,equipment_type,equipment_size,supplier_name,start_date,end_date,status,location,description,equipment:equipment_id(mia_number,name),order_operators(employee_name)')
        .lte('start_date', end)
        .gte('end_date', start)
        .not('status','eq','בוטל'),
      // all active equipment
      supabase.from('equipment').select('id,name,mia_number,dedicated_type').eq('equipment_status','active').order('name'),
      // daily_status for the range
      supabase.from('daily_status').select('record_date,entity_id,status').gte('record_date',start).lte('record_date',end),
    ]);
    setOrders(ord.data || []);
    setEquipment(eq.data || []);
    // Group daily_status by date
    const grouped = {};
    (ds.data||[]).forEach(r => {
      if (!grouped[r.record_date]) grouped[r.record_date] = [];
      grouped[r.record_date].push(r);
    });
    setDailyStatus(grouped);
    setLoading(false);
  }, [viewDate, viewMode]);

  useEffect(() => { load(); }, [load]);

  // Orders active on a given date
  function ordersOnDate(dateStr) {
    return orders.filter(o => o.start_date <= dateStr && o.end_date >= dateStr);
  }

  // Equipment status on a given date
  function equipmentOnDate(dateStr) {
    const statusToday = dailyStatus[dateStr] || [];
    const statusMap = Object.fromEntries(statusToday.map(s=>[s.entity_id, s.status]));
    // Orders on this date → which equipment is assigned
    const assignedEquipIds = new Set(
      ordersOnDate(dateStr).filter(o=>o.equipment_id).map(o=>o.equipment_id)
    );
    return equipment.map(eq => {
      const rawStatus = statusMap[eq.id];
      let displayStatus;
      if (assignedEquipIds.has(eq.id)) {
        displayStatus = 'משובץ';
      } else if (rawStatus) {
        displayStatus = rawStatus;
      } else {
        displayStatus = 'זמין'; // default if no record
      }
      // Find order for this equipment on this date
      const order = ordersOnDate(dateStr).find(o=>o.equipment_id===eq.id);
      return { ...eq, status: displayStatus, order };
    });
  }

  // Navigation
  function prev() {
    const d = new Date(viewDate);
    if (viewMode==='month') d.setMonth(d.getMonth()-1);
    else d.setDate(d.getDate()-7);
    setViewDate(d);
    setSelectedDay(null);
  }
  function next() {
    const d = new Date(viewDate);
    if (viewMode==='month') d.setMonth(d.getMonth()+1);
    else d.setDate(d.getDate()+7);
    setViewDate(d);
    setSelectedDay(null);
  }
  function goToday() { setViewDate(new Date()); setSelectedDay(fmtDate(new Date())); }

  // Month view: build grid of weeks
  function buildMonthGrid() {
    const year = viewDate.getFullYear(), month = viewDate.getMonth();
    const first = new Date(year, month, 1);
    const last  = new Date(year, month+1, 0);
    const startDay = first.getDay(); // 0=Sun
    const days = [];
    // fill leading empty
    for (let i=0; i<startDay; i++) days.push(null);
    for (let d=1; d<=last.getDate(); d++) {
      days.push(new Date(year, month, d));
    }
    // fill trailing empty to complete last row
    while (days.length % 7 !== 0) days.push(null);
    return days;
  }

  // Week view: 7 days starting from Sunday of current week
  function buildWeekDays() {
    const d = new Date(viewDate);
    const day = d.getDay();
    const sun = new Date(d); sun.setDate(d.getDate()-day);
    return Array.from({length:7}, (_,i) => { const x=new Date(sun); x.setDate(sun.getDate()+i); return x; });
  }

  const hebrewDays = ['א\'','ב\'','ג\'','ד\'','ה\'','ו\'','ש\''];
  const hebrewMonths = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  function DayCell({ date }) {
    if (!date) return <div style={{background:'#fafaf9',borderRadius:8,minHeight:100}} />;
    const ds = fmtDate(date);
    const dayOrders = ordersOnDate(ds);
    const isToday = ds === fmtDate(today);
    const isSelected = ds === selectedDay;
    const isWeekday = date.getDay()===5||date.getDay()===6; // Fri/Sat = weekend in IL
    return (
      <div
        onClick={()=>setSelectedDay(ds===selectedDay?null:ds)}
        style={{
          background: isSelected ? '#fff7ed' : isWeekday ? '#fafaf9' : 'white',
          border: isSelected ? '2px solid var(--primary)' : isToday ? '2px solid #f97316' : '1px solid var(--border)',
          borderRadius:8, minHeight:100, padding:'6px 8px', cursor:'pointer',
          transition:'all 0.15s',
        }}
      >
        {/* Day number */}
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:4}}>
          <span style={{
            fontWeight: isToday?700:500, fontSize:13,
            color: isToday ? 'white' : isWeekday ? '#a8a29e' : '#1c1917',
            background: isToday ? 'var(--primary)' : 'transparent',
            borderRadius:'50%', width:22, height:22,
            display:'flex', alignItems:'center', justifyContent:'center',
          }}>{date.getDate()}</span>
          {dayOrders.length>0 && (
            <span style={{fontSize:10,color:'#78716c'}}>{dayOrders.length} הזמנות</span>
          )}
        </div>
        {/* Order chips — show up to 3 */}
        {dayOrders.slice(0,3).map(o=>{
          const s=statusStyle(o.status);
          // Show mia_number + name for internal, supplier info for external
          // Build label: prefer joined equipment row, fallback to stored equipment_name field
          const miaNum  = o.equipment?.mia_number || o.mia_number || '';
          const eqName  = o.equipment?.name || o.equipment_name || '';
          const chipLabel = o.is_external_equipment
            ? [o.supplier_name, o.equipment_size].filter(Boolean).join(' - ') || o.equipment_type || o.order_number_display
            : [miaNum, eqName].filter(Boolean).join(' - ') || o.order_number_display;
          return (
            <div key={o.id} style={{
              background:s.bg, color:s.text, border:`1px solid ${s.border}`,
              borderRadius:4, padding:'2px 5px', fontSize:10, marginBottom:2,
              overflow:'hidden', textOverflow:'ellipsis', whiteSpace:'nowrap',
            }}>
              {chipLabel}
            </div>
          );
        })}
        {dayOrders.length>3 && (
          <div style={{fontSize:10,color:'var(--primary)',fontWeight:600}}>+{dayOrders.length-3} נוספות</div>
        )}
      </div>
    );
  }

  // Side panel for selected day
  function DayPanel({ dateStr }) {
    const dayOrders = ordersOnDate(dateStr);
    const eqList = equipmentOnDate(dateStr);
    const available = eqList.filter(e=>e.status==='זמין');
    const assigned  = eqList.filter(e=>e.status==='משובץ');
    const other     = eqList.filter(e=>e.status!=='זמין'&&e.status!=='משובץ');

    const d = new Date(dateStr);
    const dayLabel = `${hebrewDays[d.getDay()]} ${d.getDate()} ב${hebrewMonths[d.getMonth()]}`;

    function eqBadge(status) {
      if (status==='זמין')   return {bg:'#dcfce7',text:'#15803d'};
      if (status==='משובץ')  return {bg:'#dbeafe',text:'#1d4ed8'};
      return {bg:'#f3f4f6',text:'#374151'};
    }

    return (
      <div style={{
        background:'white', borderRadius:14, border:'1px solid var(--border)',
        padding:16, position:'sticky', top:24,
      }}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:12}}>
          <h3 style={{fontSize:15,fontWeight:700}}>{dayLabel}</h3>
          <button onClick={()=>setSelectedDay(null)} style={{background:'none',border:'none',cursor:'pointer',fontSize:18,color:'#78716c'}}>×</button>
        </div>

        {/* Orders section */}
        <div style={{marginBottom:16}}>
          <div style={{fontSize:13,fontWeight:700,color:'#1c1917',marginBottom:8,paddingBottom:6,borderBottom:'2px solid var(--primary)'}}>
            📋 הזמנות ({dayOrders.length})
          </div>
          {dayOrders.length===0 ? (
            <div style={{fontSize:12,color:'#a8a29e',padding:'8px 0'}}>אין הזמנות ביום זה</div>
          ) : dayOrders.map(o=>{
            const s=statusStyle(o.status);
            // For external equipment: show "supplier - size", for internal: equipment name
            const panelMia  = o.equipment?.mia_number || o.mia_number || '';
            const panelName = o.equipment?.name || o.equipment_name || '';
            const eqName = o.is_external_equipment
              ? [o.supplier_name, o.equipment_size].filter(Boolean).join(' - ') || o.equipment_type || '(חיצוני)'
              : [panelMia, panelName].filter(Boolean).join(' - ') || '';
            return (
              <div key={o.id} style={{
                border:`1px solid ${s.border}`, borderRadius:8,
                padding:'8px 10px', marginBottom:8, background:s.bg,
              }}>
                <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
                  <span style={{fontWeight:600,fontSize:13}}>{o.order_number_display}</span>
                  <span style={{fontSize:11,color:s.text,fontWeight:600}}>{o.status}</span>
                </div>
                <div style={{fontSize:12,color:'#57534e',marginTop:2}}>{o.client_name}</div>
                {eqName && (
                  <div style={{fontSize:12,color:'#78716c',display:'flex',alignItems:'center',gap:4}}>
                    🏗️ {eqName}
                    {o.is_external_equipment && <span style={{fontSize:10,background:'#fef3c7',color:'#92400e',padding:'1px 5px',borderRadius:4,fontWeight:600}}>חיצוני</span>}
                  </div>
                )}
                {o.location && <div style={{fontSize:11,color:'#78716c'}}>📍 {o.location}</div>}
                {o.description && <div style={{fontSize:11,color:'#57534e',marginTop:3,borderTop:'1px solid rgba(0,0,0,0.06)',paddingTop:3}}>{o.description}</div>}
              </div>
            );
          })}
        </div>

        {/* Assigned equipment shown inside orders above — no separate section needed */}

        {available.length>0 && (
          <div style={{marginBottom:12}}>
            <div style={{fontSize:13,fontWeight:700,color:'#15803d',marginBottom:8,paddingBottom:6,borderBottom:'2px solid #86efac'}}>🟢 כלים זמינים ({available.length})</div>
            {available.map(eq=>(
              <div key={eq.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 8px',background:'#f0fdf4',borderRadius:6,marginBottom:4}}>
                <span style={{fontSize:12,fontWeight:500}}>{eq.name}{eq.mia_number ? ` מי"ה ${eq.mia_number}` : ''}</span>
                <span style={{fontSize:10,background:'#dcfce7',color:'#15803d',padding:'2px 6px',borderRadius:4,fontWeight:600}}>זמין</span>
              </div>
            ))}
          </div>
        )}

        {other.length>0 && (
          <div>
            <div style={{fontSize:13,fontWeight:700,color:'#78716c',marginBottom:8,paddingBottom:6,borderBottom:'2px solid #d1d5db'}}>⚪ כלים פנויים ({other.length})</div>
            {other.map(eq=>(
              <div key={eq.id} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'5px 8px',background:'#f5f5f4',borderRadius:6,marginBottom:4}}>
                <span style={{fontSize:12,fontWeight:500}}>{eq.name}{eq.mia_number ? ` מי"ה ${eq.mia_number}` : ''}</span>
                <span style={{fontSize:10,background:'#e7e5e4',color:'#57534e',padding:'2px 6px',borderRadius:4,fontWeight:600}}>{eq.status}</span>
              </div>
            ))}
          </div>
        )}
      </div>
    );
  }

  const monthDays = buildMonthGrid();
  const weekDays  = buildWeekDays();

  const titleLabel = viewMode==='month'
    ? `${hebrewMonths[viewDate.getMonth()]} ${viewDate.getFullYear()}`
    : `שבוע ${fmtDate(weekDays[0])} – ${fmtDate(weekDays[6])}`;

  return (
    <div>
      {toast}
      {/* Header */}
      <div className="page-header">
        <div>
          <h2>📅 לוח שנה</h2>
          <p style={{color:'var(--text-muted)',fontSize:13}}>הזמנות וזמינות כלים</p>
        </div>
        <div style={{display:'flex',gap:8,alignItems:'center'}}>
          <button className="btn btn-outline btn-sm" onClick={goToday}>היום</button>
          <div style={{display:'flex',border:'1px solid var(--border)',borderRadius:8,overflow:'hidden'}}>
            {['month','week'].map(m=>(
              <button key={m} onClick={()=>{setViewMode(m);setSelectedDay(null);}} style={{
                padding:'6px 12px',fontSize:13,border:'none',cursor:'pointer',
                background:viewMode===m?'var(--primary)':'white',
                color:viewMode===m?'white':'var(--text)',fontWeight:viewMode===m?600:400,
              }}>{m==='month'?'חודשי':'שבועי'}</button>
            ))}
          </div>
        </div>
      </div>

      <div style={{display:'grid',gridTemplateColumns:selectedDay?'1fr 300px':'1fr',gap:16,alignItems:'start'}}>
        {/* Calendar */}
        <div style={{background:'white',borderRadius:14,border:'1px solid var(--border)',overflow:'hidden'}}>
          {/* Nav bar */}
          <div style={{
            background:'var(--primary)',color:'white',
            display:'flex',justifyContent:'space-between',alignItems:'center',
            padding:'14px 20px',
          }}>
            <button onClick={next} style={{background:'none',border:'none',color:'white',fontSize:20,cursor:'pointer'}}>›</button>
            <span style={{fontWeight:700,fontSize:17}}>{titleLabel}</span>
            <button onClick={prev} style={{background:'none',border:'none',color:'white',fontSize:20,cursor:'pointer'}}>‹</button>
          </div>

          {/* Day headers */}
          <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,padding:'8px 8px 4px'}}>
            {hebrewDays.map(d=>(
              <div key={d} style={{textAlign:'center',fontSize:12,fontWeight:600,color:'#78716c',padding:'4px 0'}}>{d}</div>
            ))}
          </div>

          {/* Month grid */}
          {viewMode==='month' && (
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,padding:'0 8px 8px'}}>
              {monthDays.map((d,i)=><DayCell key={i} date={d} />)}
            </div>
          )}

          {/* Week grid */}
          {viewMode==='week' && (
            <div style={{display:'grid',gridTemplateColumns:'repeat(7,1fr)',gap:4,padding:'0 8px 8px'}}>
              {weekDays.map((d,i)=>(
                <div key={i} style={{minHeight:300}}>
                  <DayCell date={d} />
                </div>
              ))}
            </div>
          )}

          {loading && (
            <div style={{textAlign:'center',padding:16,color:'#78716c',fontSize:13}}>טוען...</div>
          )}
        </div>

        {/* Day panel */}
        {selectedDay && <DayPanel dateStr={selectedDay} />}
      </div>
    </div>
  );
}

// ══════════════════════════════════════════════════════════════════════════════
// SETTINGS PAGE — manage lookup lists (license types, etc.)
// ══════════════════════════════════════════════════════════════════════════════
// ══════════════════════════════════════════════════════════════════════════════
// SCHEDULE PAGE — weekly operator assignment grid
// ══════════════════════════════════════════════════════════════════════════════
function SchedulePage() {
  const { toast, show } = useToast();

  const today = new Date();

  // Start from Sunday of current week
  function sundayOf(d) {
    const x = new Date(d);
    x.setDate(x.getDate() - x.getDay());
    x.setHours(0,0,0,0);
    return x;
  }

  const [weekStart, setWeekStart] = useState(sundayOf(today));
  const [employees, setEmployees] = useState([]);
  const [assignments, setAssignments] = useState({});
  const [attendance, setAttendance] = useState({});
  const [externalRows, setExternalRows] = useState([]);
  const [equipmentLicenses, setEquipmentLicenses] = useState([]);
  const [loading, setLoading] = useState(true);

  // Use local date string to avoid UTC shift (Israel = UTC+3)
  function fmtDate(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth()+1).padStart(2,'0');
    const day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  }

  function weekDays() {
    return Array.from({length:7}, (_,i) => {
      const d = new Date(weekStart);
      d.setDate(weekStart.getDate() + i);
      return d;
    });
  }

  const days = weekDays();
  const startStr = fmtDate(days[0]);
  const endStr   = fmtDate(days[6]);

  const hebrewDayShort = ['א\'','ב\'','ג\'','ד\'','ה\'','ו\'','ש\''];
  const hebrewMonths   = ['ינואר','פברואר','מרץ','אפריל','מאי','יוני','יולי','אוגוסט','ספטמבר','אוקטובר','נובמבר','דצמבר'];

  const load = useCallback(async () => {
    setLoading(true);
    const [empRes, ordRes, attRes, extRes, licRes] = await Promise.all([
      // active employees
      supabase.from('employees').select('id,full_name,role').eq('employee_status','active').order('full_name'),
      // orders that overlap this week (not cancelled), with their operators
      supabase.from('orders')
        .select('id,order_number_display,equipment_id,equipment_name,mia_number,start_date,end_date,status,equipment:equipment_id(mia_number,name),order_operators(employee_id,employee_name)')
        .lte('start_date', endStr)
        .gte('end_date', startStr)
        .not('status','eq','בוטל'),
      // attendance for the week
      supabase.from('employee_daily_status')
        .select('employee_id,record_date,status')
        .gte('record_date', startStr)
        .lte('record_date', endStr),
      // external equipment orders for this week
      supabase.from('orders')
        .select('id,order_number_display,start_date,end_date,status,supplier_name,equipment_type,equipment_size')
        .eq('is_external_equipment', true)
        .lte('start_date', endStr)
        .gte('end_date', startStr)
        .not('status','eq','בוטל'),
      // equipment licenses table
      supabase.from('equipment')
        .select('id,name,mia_number,equipment_number,license_date,inspector_date,transport_license_date')
        .not('equipment_status','eq','נמכר')
        .order('name'),
    ]);

    setEmployees(empRes.data || []);

    // Build assignments map: { 'empId|date': [{mia, name}, ...] }
    const asgn = {};
    (ordRes.data || []).forEach(o => {
      (o.order_operators || []).forEach(op => {
        days.forEach(d => {
          const ds = fmtDate(d);
          if (ds >= o.start_date && ds <= o.end_date) {
            const key = `${op.employee_id}|${ds}`;
            if (!asgn[key]) asgn[key] = [];
            const mia  = o.equipment?.mia_number || o.mia_number || '';
            const name = o.equipment?.name || o.equipment_name || '';
            // Avoid duplicates by mia+name combo
            if (!asgn[key].some(x => x.mia===String(mia) && x.name===name))
              asgn[key].push({ mia: String(mia), name });
          }
        });
      });
    });
    setAssignments(asgn);

    // Build external rows: group by supplier_name
    // Each unique supplier gets a "row", cells show equipment_size on active dates
    const extMap = {}; // { supplier_name: { date: [size, ...] } }
    (extRes.data || []).forEach(o => {
      const supplier = o.supplier_name || 'ספק חיצוני';
      if (!extMap[supplier]) extMap[supplier] = {};
      days.forEach(d => {
        const ds = fmtDate(d);
        if (ds >= o.start_date && ds <= o.end_date) {
          if (!extMap[supplier][ds]) extMap[supplier][ds] = [];
          const label = [o.equipment_size, o.equipment_type].filter(Boolean).join(' ') || o.order_number_display;
          if (!extMap[supplier][ds].includes(label)) extMap[supplier][ds].push(label);
        }
      });
    });
    setExternalRows(Object.entries(extMap).map(([supplier, dates]) => ({ supplier, dates })));
    setEquipmentLicenses(licRes.data || []);

    // Build attendance map: { 'empId|date': status }
    const att = {};
    (attRes.data || []).forEach(r => {
      att[`${r.employee_id}|${r.record_date}`] = r.status;
    });
    setAttendance(att);

    setLoading(false);
  }, [weekStart]);

  useEffect(() => { load(); }, [load]);

  function prevWeek() { const d=new Date(weekStart); d.setDate(d.getDate()-7); setWeekStart(d); }
  function nextWeek() { const d=new Date(weekStart); d.setDate(d.getDate()+7); setWeekStart(d); }
  function goToday()  { setWeekStart(sundayOf(today)); }

  // Translate English DB values to Hebrew display
  const ATT_HE = {
    'present':      'נוכח',
    'vacation':     'חופש',
    'sick':         'מחלה',
    'reserve_duty': 'מילואים',
    'training':     'הדרכה',
    'other':        'אחר',
    'weekend':      'סופ"ש',
  };
  function attHe(status) { return ATT_HE[status] || status || ''; }

  // Status badge style
  function attStyle(status) {
    const he = attHe(status);
    const map = {
      'נוכח':    { bg:'#f0fdf4', text:'#15803d', border:'#86efac' },
      'סופ"ש':  { bg:'#e7e5e4', text:'#78716c', border:'#d6d3d1' },
      'חופש':   { bg:'#eff6ff', text:'#1d4ed8', border:'#93c5fd' },
      'מחלה':   { bg:'#fef2f2', text:'#b91c1c', border:'#fca5a5' },
      'מילואים':{ bg:'#fefce8', text:'#854d0e', border:'#fde047' },
      'הדרכה':  { bg:'#fdf4ff', text:'#7e22ce', border:'#d8b4fe' },
      'אחר':    { bg:'#f5f5f4', text:'#57534e', border:'#d6d3d1' },
    };
    return map[he] || { bg:'#f5f5f4', text:'#57534e', border:'#d6d3d1' };
  }

  const weekLabel = `${days[0].getDate()}/${days[0].getMonth()+1} – ${days[6].getDate()}/${days[6].getMonth()+1}/${days[6].getFullYear()}`;

  // Legend items
  const legend = [
    { label:'מס\' כלי',              bg:'#dcfce7', text:'#15803d' },
    { label:'משובץ להזמנה מאושרת',   bg:'#dbeafe', text:'#1d4ed8' },
    { label:'חופש',                  bg:'#eff6ff', text:'#1d4ed8' },
    { label:'מילואים',               bg:'#fefce8', text:'#854d0e' },
    { label:'מחלה',                  bg:'#fef2f2', text:'#b91c1c' },
    { label:'הדרכה',                 bg:'#fdf4ff', text:'#7e22ce' },
    { label:'סופ"ש',                 bg:'#f5f5f4', text:'#78716c' },
    { label:'אחר',                   bg:'#f5f5f4', text:'#57534e' },
    { label:'פנוי / נוכח',           bg:'white',   text:'#78716c', dash:true },
  ];

  // Format date for display: DD/MM/YYYY, red if expired, orange if within 30 days
  function fmtLicDate(dateStr) {
    if (!dateStr) return { label:'—', color:'#a8a29e', expired:false };
    const d = new Date(dateStr);
    const now = new Date();
    const diff = (d - now) / (1000*60*60*24);
    const label = `${String(d.getDate()).padStart(2,'0')}/${String(d.getMonth()+1).padStart(2,'0')}/${d.getFullYear()}`;
    if (diff < 0)  return { label, color:'#dc2626', expired:true };   // expired — red
    if (diff < 30) return { label, color:'#d97706', expired:false };  // soon — orange
    return { label, color:'#15803d', expired:false };                 // ok — green
  }

  // TV-optimized sizes
  const TV = { headerFontSize:18, cellFontSize:16, nameFontSize:17, rowHeight:56, badgeFontSize:14, badgePad:'6px 14px' };

  return (
    <div style={{fontSize:TV.cellFontSize}}>
      {toast}

      {/* ── Header ── */}
      <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',marginBottom:20}}>
        <div>
          <h2 style={{fontSize:26,fontWeight:800}}>👷 לוח שיבוץ שבועי</h2>
          <p style={{color:'var(--text-muted)',fontSize:15}}>שיבוץ עובדים לפי שבוע</p>
        </div>
        <div style={{display:'flex',gap:10,alignItems:'center'}}>
          <button className="btn btn-outline" onClick={goToday} style={{fontSize:15,padding:'8px 18px'}}>השבוע</button>
          <div style={{display:'flex',alignItems:'center',gap:6,border:'2px solid var(--border)',borderRadius:10,padding:'6px 16px',background:'white',fontSize:16,fontWeight:600}}>
            <button onClick={prevWeek} style={{background:'none',border:'none',cursor:'pointer',fontSize:22,color:'var(--primary)',lineHeight:1}}>‹</button>
            <span style={{minWidth:200,textAlign:'center'}}>{weekLabel}</span>
            <button onClick={nextWeek} style={{background:'none',border:'none',cursor:'pointer',fontSize:22,color:'var(--primary)',lineHeight:1}}>›</button>
          </div>
        </div>
      </div>

      {/* ── Assignment grid ── */}
      <div style={{background:'white',borderRadius:16,border:'2px solid var(--border)',overflowX:'auto',marginBottom:24}}>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr>
              <th style={{
                padding:'14px 20px',textAlign:'right',fontSize:TV.headerFontSize,fontWeight:700,
                background:'#f5f5f4',borderBottom:'2px solid var(--border)',
                position:'sticky',right:0,zIndex:2,minWidth:160,
              }}>👤 עובד</th>
              {days.map(d => {
                const isToday = fmtDate(d)===fmtDate(today);
                const isWknd  = d.getDay()===5||d.getDay()===6;
                return (
                  <th key={fmtDate(d)} style={{
                    padding:'10px 6px',textAlign:'center',fontSize:TV.headerFontSize,fontWeight:700,
                    background: isToday ? 'var(--primary)' : isWknd ? '#e7e5e4' : '#f5f5f4',
                    color: isToday ? 'white' : isWknd ? '#78716c' : '#1c1917',
                    borderBottom:'2px solid var(--border)',minWidth:110,
                  }}>
                    <div style={{fontSize:15}}>{hebrewDayShort[d.getDay()]}</div>
                    <div style={{fontSize:TV.headerFontSize+2,fontWeight:800}}>{d.getDate()}/{d.getMonth()+1}</div>
                  </th>
                );
              })}
            </tr>
          </thead>
          <tbody>
            {loading ? (
              <tr><td colSpan={8} style={{padding:32,textAlign:'center',color:'#78716c',fontSize:18}}>טוען...</td></tr>
            ) : employees.map((emp, ri) => (
              <tr key={emp.id} style={{background:ri%2===0?'white':'#fafaf9',height:TV.rowHeight}}>
                <td style={{
                  padding:'8px 20px',fontSize:TV.nameFontSize,fontWeight:600,
                  borderBottom:'1px solid #e7e5e4',
                  position:'sticky',right:0,background:ri%2===0?'white':'#fafaf9',zIndex:1,
                }}>
                  {emp.full_name}
                  {emp.role && <div style={{fontSize:12,color:'#a8a29e',fontWeight:400}}>{emp.role}</div>}
                </td>
                {days.map(d => {
                  const ds   = fmtDate(d);
                  const key  = `${emp.id}|${ds}`;
                  const asgn = assignments[key];
                  const att  = attendance[key];
                  const isWknd = d.getDay()===5||d.getDay()===6;
                  const cellBg = isWknd ? '#ede9e8' : undefined;
                  const attLabel = attHe(att); // translate to Hebrew

                  if (asgn && asgn.length > 0) {
                    // Assigned to equipment order — show name + mia badge
                    return (
                      <td key={ds} style={{padding:'4px 6px',borderBottom:'1px solid #e7e5e4',textAlign:'center',background:cellBg}}>
                        {asgn.map((item,i) => (
                          <div key={i} style={{
                            background:'#16a34a',color:'white',
                            borderRadius:8,padding:'4px 10px',fontSize:TV.badgeFontSize,fontWeight:700,
                            marginBottom:3,display:'inline-block',lineHeight:1.3,
                          }}>
                            {item.name && <div style={{fontSize:TV.badgeFontSize-1}}>{item.name}</div>}
                            {item.mia  && <div style={{fontSize:TV.badgeFontSize+1}}>מי"ה {item.mia}</div>}
                          </div>
                        ))}
                      </td>
                    );
                  } else if (isWknd) {
                    // Weekend — grey background
                    return (
                      <td key={ds} style={{padding:'6px',borderBottom:'1px solid #e7e5e4',textAlign:'center',background:'#ede9e8'}}>
                        <span style={{fontSize:13,color:'#a8a29e',fontWeight:500}}>סופ"ש</span>
                      </td>
                    );
                  } else if (att && attLabel !== 'נוכח') {
                    // Absent / special status
                    const s = attStyle(att);
                    return (
                      <td key={ds} style={{padding:'6px',borderBottom:'1px solid #e7e5e4',textAlign:'center'}}>
                        <span style={{
                          background:s.bg,color:s.text,border:`2px solid ${s.border}`,
                          borderRadius:8,padding:TV.badgePad,fontSize:TV.badgeFontSize,fontWeight:600,
                          display:'inline-block',
                        }}>{attLabel}</span>
                      </td>
                    );
                  } else if (att === 'present') {
                    // Explicitly marked present
                    return (
                      <td key={ds} style={{padding:'6px',borderBottom:'1px solid #e7e5e4',textAlign:'center'}}>
                        <span style={{
                          background:'#f0fdf4',color:'#15803d',border:'2px solid #86efac',
                          borderRadius:8,padding:TV.badgePad,fontSize:TV.badgeFontSize,fontWeight:600,
                          display:'inline-block',
                        }}>נוכח</span>
                      </td>
                    );
                  } else {
                    // No data — show dash (unknown)
                    return (
                      <td key={ds} style={{padding:'6px',borderBottom:'1px solid #e7e5e4',textAlign:'center',color:'#d6d3d1',fontSize:22}}>
                        —
                      </td>
                    );
                  }
                })}
              </tr>
            ))}
            {/* External equipment rows */}
            {externalRows.length > 0 && (
              <>
                <tr>
                  <td colSpan={8} style={{padding:'8px 20px',background:'#fff7ed',fontSize:15,fontWeight:700,color:'var(--primary-dark)',borderTop:'3px solid var(--primary-light)'}}>
                    🏗️ כלים חיצוניים
                  </td>
                </tr>
                {externalRows.map((row, ri) => (
                  <tr key={row.supplier} style={{background:ri%2===0?'#fffbf7':'#fff7ed',height:TV.rowHeight}}>
                    <td style={{
                      padding:'8px 20px',fontSize:TV.nameFontSize,fontWeight:600,
                      borderBottom:'1px solid #fed7aa',
                      position:'sticky',right:0,background:ri%2===0?'#fffbf7':'#fff7ed',zIndex:1,
                    }}>
                      {row.supplier}
                      <div style={{fontSize:12,color:'#a8a29e',fontWeight:400}}>ספק חיצוני</div>
                    </td>
                    {days.map(d => {
                      const ds = fmtDate(d);
                      const items = row.dates[ds];
                      const isWknd = d.getDay()===5||d.getDay()===6;
                      return (
                        <td key={ds} style={{padding:'6px',borderBottom:'1px solid #fed7aa',textAlign:'center',background:isWknd?'#fef3c7':undefined}}>
                          {items ? items.map(label => (
                            <div key={label} style={{
                              background:'#ea580c',color:'white',
                              borderRadius:8,padding:TV.badgePad,fontSize:TV.badgeFontSize,fontWeight:700,
                              marginBottom:3,display:'inline-block',
                            }}>{label}</div>
                          )) : <span style={{color:'#d6d3d1',fontSize:22}}>—</span>}
                        </td>
                      );
                    })}
                  </tr>
                ))}
              </>
            )}
          </tbody>
        </table>
      </div>

      {/* ── Legend ── */}
      <div style={{marginBottom:28,display:'flex',flexWrap:'wrap',gap:10,justifyContent:'flex-end',alignItems:'center'}}>
        {legend.map(l => (
          <span key={l.label} style={{
            background:l.bg,color:l.text,
            border:l.dash?'1px dashed #d6d3d1':`1px solid ${l.bg==='white'?'#e7e5e4':l.bg}`,
            borderRadius:8,padding:'5px 14px',fontSize:14,fontWeight:500,
          }}>{l.label}</span>
        ))}
        <span style={{color:'#a8a29e',fontSize:14}}>— פנוי / נוכח</span>
      </div>

      {/* ── Equipment licenses table ── */}
      <div style={{background:'white',borderRadius:16,border:'2px solid var(--border)',overflow:'hidden'}}>
        <div style={{background:'#1c1917',padding:'14px 20px',display:'flex',alignItems:'center',gap:10}}>
          <span style={{fontSize:20}}>📋</span>
          <span style={{color:'white',fontSize:18,fontWeight:700}}>תוקפי רישיונות כלים</span>
          <span style={{color:'#a8a29e',fontSize:13,marginRight:'auto'}}>🟢 תקף &nbsp; 🟠 פחות מ-30 יום &nbsp; 🔴 פג תוקף</span>
        </div>
        <table style={{width:'100%',borderCollapse:'collapse'}}>
          <thead>
            <tr style={{background:'#f5f5f4'}}>
              {['שם כלי','מס\' מי"ה','רישוי','בודק מוסמך','רישיון מוביל'].map(h=>(
                <th key={h} style={{padding:'12px 16px',textAlign:'right',fontSize:15,fontWeight:700,color:'#1c1917',borderBottom:'2px solid var(--border)'}}>{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {equipmentLicenses.map((eq,ri)=>{
              const lic  = fmtLicDate(eq.license_date);
              const insp = fmtLicDate(eq.inspector_date);
              const tran = fmtLicDate(eq.transport_license_date);
              const rowBg = ri%2===0?'white':'#fafaf9';
              function Cell({d}){
                return (
                  <td style={{padding:'12px 16px',borderBottom:'1px solid #f0ede9',fontSize:TV.cellFontSize}}>
                    <span style={{
                      background: d.expired?'#fee2e2': d.color==='#d97706'?'#fef9c3':'#f0fdf4',
                      color:d.color, fontWeight:700, borderRadius:6, padding:'4px 10px',
                    }}>{d.label}</span>
                  </td>
                );
              }
              return (
                <tr key={eq.id} style={{background:rowBg}}>
                  <td style={{padding:'12px 16px',fontSize:TV.nameFontSize,fontWeight:600,borderBottom:'1px solid #f0ede9'}}>
                    {eq.name}
                    {eq.equipment_number && <span style={{fontSize:12,color:'#78716c',marginRight:6}}>({eq.equipment_number})</span>}
                  </td>
                  <td style={{padding:'12px 16px',fontSize:TV.cellFontSize,fontWeight:500,borderBottom:'1px solid #f0ede9',color:'#57534e'}}>
                    {eq.mia_number||'—'}
                  </td>
                  <Cell d={lic}/>
                  <Cell d={insp}/>
                  <Cell d={tran}/>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
    </div>
  );
}
